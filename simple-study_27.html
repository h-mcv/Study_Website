<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2E63F6">
    <title>Simple Study</title>
    <style>
        :root {
            --bg: #f5f5fb;
            --surface: #ffffff;
            --surface-2: #f8f8fc;
            --text: #222238;
            --muted: #70708a;
            --line: #e4e3ef;
            --primary: #2E63F6;
            --primary-soft: #e8f0ff;
            --success: #16845b;
            --success-soft: #e5f6ed;
            --warning: #ae6800;
            --warning-soft: #fff3d5;
            --danger: #bd3f53;
            --danger-soft: #fde9ed;
            --shadow: 0 12px 32px rgba(20, 40, 95, .08);
            --radius: 18px;
            --main-px: clamp(18px, 4vw, 54px);
        }
        body.dark {
            --bg: #151521;
            --surface: #202031;
            --surface-2: #27273a;
            --text: #f5f4fb;
            --muted: #b3b1c6;
            --line: #3c3b52;
            --primary: #7EA6FF;
            --primary-soft: #1f3a66;
            --success: #68dba3;
            --success-soft: #1d4034;
            --warning: #ffc96b;
            --warning-soft: #4a381a;
            --danger: #ff9cac;
            --danger-soft: #4b2731;
            --shadow: 0 12px 32px rgba(0, 0, 0, .2);
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-width: 320px;
            background: var(--bg);
            color: var(--text);
            font: 15px/1.45 Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }
        button,
        input,
        select,
        textarea {
            font: inherit;
        }
        button {
            cursor: pointer;
        }
        button:focus-visible,
        input:focus-visible,
        select:focus-visible,
        textarea:focus-visible {
            outline: 3px solid rgba(46, 99, 246, .35);
            outline-offset: 2px;
        }
        .app-shell {
            min-height: 100vh;
            position: relative;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: 236px;
            height: 100vh;
            padding: 22px 14px;
            border-right: 1px solid var(--line);
            background: var(--surface);
            display: flex;
            flex-direction: column;
            gap: 24px;
            z-index: 10;
            overflow: hidden;
        }
        .sidebar.collapsed {
            width: 60px;
            padding: 22px 10px;
        }
        main {
            margin-left: 236px;
        }
        .app-shell.sidebar-mode-collapsed main,
        .app-shell.sidebar-mode-hover main {
            margin-left: 60px;
        }
        .app-shell.sidebar-mode-hover .sidebar {
            width: 60px;
            padding: 22px 10px;
            white-space: nowrap;
            transition: width 0.16s ease, padding 0.16s ease;
        }
        .app-shell.sidebar-mode-hover .sidebar:hover {
            width: 236px;
            padding: 22px 14px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, .22);
        }
        .app-shell.sidebar-mode-hover .sidebar:not(:hover) .brand .brand-label,
        .app-shell.sidebar-mode-hover .sidebar:not(:hover) .nav span,
        .app-shell.sidebar-mode-hover .sidebar:not(:hover) .sidebar-footer span {
            display: none;
        }
        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 9px;
            font-weight: 800;
            letter-spacing: -.03em;
            font-size: 18px;
            position: relative;
            flex-shrink: 0;
        }
        .brand-mark {
            width: 31px;
            height: 31px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--primary), #6EA0FF);
            color: #fff;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            box-shadow: 0 8px 16px rgba(46, 99, 246, .28);
        }
        .sidebar.collapsed .brand {
            justify-content: center;
            padding: 0;
        }
        .sidebar.collapsed .brand .brand-label,
        .sidebar.collapsed .nav span,
        .sidebar.collapsed .sidebar-footer span {
            display: none;
        }
        .nav {
            display: grid;
            gap: 5px;
        }
        .nav button {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 11px 12px;
            display: flex;
            align-items: center;
            gap: 11px;
            border-radius: 11px;
            text-align: left;
            font-weight: 650;
        }
        .nav button:hover {
            background: var(--surface-2);
            color: var(--text);
        }
        .nav button.active {
            background: var(--primary-soft);
            color: var(--primary);
        }
        .sidebar.collapsed .nav button {
            justify-content: center;
            padding: 11px 10px;
        }
        .sidebar-footer {
            margin-top: auto;
            border-top: 1px solid var(--line);
            padding-top: 14px;
            display: grid;
            gap: 6px;
        }
        .sidebar-footer button {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 9px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            text-align: left;
        }
        .sidebar-footer button:hover {
            background: var(--surface-2);
            color: var(--text);
        }
        .sidebar.collapsed .sidebar-footer button {
            justify-content: center;
            padding: 9px 10px;
        }
        main {
            padding: 30px 0 52px;
            min-width: 0;
        }
        .page {
            max-width: 1480px;
            margin: 0 auto;
            padding: 0 var(--main-px);
        }
        .page+.page {
            margin-top: 18px;
        }
        .full-width-wrapper {
            padding: 0 var(--main-px);
            margin-top: 18px;
        }
        .page-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 27px;
        }
        h1,
        h2,
        h3,
        p {
            margin-top: 0;
        }
        h1 {
            margin-bottom: 6px;
            font-size: clamp(28px, 3.2vw, 38px);
            letter-spacing: -.055em;
            line-height: 1.08;
        }
        h2 {
            margin-bottom: 5px;
            letter-spacing: -.03em;
            font-size: 20px;
        }
        h3 {
            margin-bottom: 4px;
            font-size: 15px;
        }
        .small {
            font-size: 12px;
            color: var(--muted);
        }
        .muted {
            color: var(--muted);
        }
        .toolbar,
        .row {
            display: flex;
            align-items: center;
            gap: 9px;
            flex-wrap: wrap;
        }
        .toolbar {
            justify-content: flex-end;
        }
        .button {
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--text);
            padding: 9px 12px;
            border-radius: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            line-height: 1;
            white-space: nowrap;
        }
        .button:hover {
            background: var(--surface-2);
        }
        .button.primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 8px 16px rgba(46, 99, 246, .2);
        }
        .button.primary:hover {
            filter: brightness(.96);
        }
        .button.danger {
            color: var(--danger);
        }
        .button.icon {
            width: 37px;
            height: 37px;
            padding: 0;
            justify-content: center;
            border-radius: 11px;
        }
        .button.ghost {
            background: transparent;
            border-color: transparent;
        }
        .button.ghost:hover {
            background: var(--surface-2);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 13px;
            margin-bottom: 21px;
        }
        .task-indicator {
            display: inline-block;
            width: 9px;
            height: 9px;
            border-radius: 50%;
            margin-right: 7px;
            vertical-align: middle;
            flex: none;
        }
        .task-indicator.homework {
            background: var(--primary);
        }
        .task-indicator.test {
            background: #E8A33D;
        }
        .task-indicator.important {
            background: #E0524B;
        }
        .study-blocks {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 18px;
        }
        .study-block {
            padding: 17px;
        }
        .study-block-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .study-block-head h3 {
            font-size: 16px;
        }
        .study-items {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .study-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding: 11px 13px;
            background: var(--surface-2);
            border-radius: var(--radius);
        }
        .study-item.logged {
            opacity: .72;
        }
        .study-item-main {
            display: flex;
            align-items: center;
            gap: 10px;
            min-width: 0;
        }
        .subject-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            flex: none;
        }
        .study-item-text {
            display: flex;
            flex-direction: column;
            gap: 2px;
            min-width: 0;
        }
        .study-item-text strong {
            font-size: 14px;
        }
        .log-form {
            display: flex;
            gap: 8px;
            padding: 0 13px 11px;
            margin-top: -6px;
        }
        .log-form input {
            flex: 1;
        }
        .card {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }
        .stat {
            padding: 17px;
            min-height: 126px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .stat .label {
            color: var(--muted);
            font-size: 12px;
            font-weight: 700;
        }
        .stat .value {
            font-size: 28px;
            letter-spacing: -.05em;
            font-weight: 800;
            line-height: 1;
        }
        .stat .detail {
            font-size: 12px;
            color: var(--muted);
        }
        .stat.cushion-good {
            border-color: rgba(22, 132, 91, .3);
            background: linear-gradient(135deg, var(--surface), var(--success-soft));
        }
        .stat.cushion-tight {
            border-color: rgba(174, 104, 0, .35);
            background: linear-gradient(135deg, var(--surface), var(--warning-soft));
        }
        .stat.cushion-bad {
            border-color: rgba(189, 63, 83, .35);
            background: linear-gradient(135deg, var(--surface), var(--danger-soft));
        }
        .section {
            padding: 19px;
        }
        .section-title {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }
        .section-title h2 {
            margin: 0;
        }
        .empty {
            color: var(--muted);
            font-size: 13px;
            padding: 17px 0;
            text-align: center;
        }
        .method {
            margin-top: 13px;
            padding: 10px 11px;
            background: rgba(255, 255, 255, .13);
            border-radius: 10px;
            font-size: 12px;
        }
        .list {
            display: grid;
            gap: 8px;
        }
        .task-row {
            display: grid;
            grid-template-columns: auto minmax(0, 1fr) auto;
            align-items: center;
            gap: 11px;
            padding: 11px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: var(--surface-2);
        }
        .task-row:hover {
            border-color: rgba(46, 99, 246, .35);
        }
        .check {
            width: 20px;
            height: 20px;
            padding: 0;
            border-radius: 6px;
            border: 1.5px solid var(--line);
            background: var(--surface);
            color: white;
            display: grid;
            place-items: center;
            font-weight: 900;
        }
        .check.done {
            background: var(--success);
            border-color: var(--success);
        }
        .task-row.done .task-name {
            text-decoration: line-through;
            color: var(--muted);
        }
        .task-name {
            min-width: 0;
            font-weight: 750;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .task-meta {
            color: var(--muted);
            font-size: 12px;
            margin-top: 2px;
        }
        .pill {
            padding: 4px 7px;
            font-size: 11px;
            border-radius: 999px;
            white-space: nowrap;
            font-weight: 750;
            background: var(--primary-soft);
            color: var(--primary);
        }
        .pill.good {
            color: var(--success);
            background: var(--success-soft);
        }
        .pill.warn {
            color: var(--warning);
            background: var(--warning-soft);
        }
        .pill.bad {
            color: var(--danger);
            background: var(--danger-soft);
        }
        .pill.neutral {
            color: var(--muted);
            background: var(--surface-2);
            border: 1px solid var(--line);
        }
        .timeline-card {
            padding: 0;
            overflow: hidden;
        }
        .weekbar {
            padding: 15px 17px;
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }
        .weekbar h2 {
            margin: 0;
        }
        .timetable-scroll {
            overflow-y: auto;
            overflow-x: hidden;
            max-height: 640px;
            -webkit-overflow-scrolling: touch;
        }
        .timetable-scroll.dashboard {
            max-height: 560px;
        }
        .timetable-grid {
            width: 100%;
            display: grid;
            grid-template-columns: clamp(26px, 6vw, 40px) repeat(7, 1fr);
            position: relative;
        }
        .timetable-head {
            min-height: 55px;
            border-bottom: 1px solid var(--line);
            background: var(--surface);
            position: sticky;
            top: 0;
            z-index: 4;
        }
        .time-head {
            border-right: 1px solid var(--line);
        }
        .day-head {
            padding: 10px 7px;
            text-align: center;
            border-right: 1px solid var(--line);
        }
        .day-head .dow {
            font-size: 11px;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
        }
        .day-head .date {
            font-size: 16px;
            font-weight: 800;
        }
        .day-head.today .date {
            display: inline-grid;
            place-items: center;
            height: 27px;
            min-width: 27px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
        }
        .day-head.dayoff {
            background: var(--warning-soft);
        }
        .day-head.holiday {
            background: var(--surface-2);
            opacity: .7;
        }
        .time-body {
            height: var(--table-height, 660px);
            position: relative;
            border-right: 1px solid var(--line);
            background: var(--surface);
        }
        .day-body {
            height: var(--table-height, 660px);
            position: relative;
            border-right: 1px solid var(--line);
            background: var(--surface);
            overflow: hidden;
        }
        .day-body.dayoff {
            background: color-mix(in srgb, var(--warning-soft) 55%, var(--surface));
        }
        .day-body.holiday {
            background: var(--surface-2);
        }
        .hour-line {
            position: absolute;
            left: 0;
            right: 0;
            border-top: 1px solid var(--line);
        }
        .hour-label {
            position: absolute;
            top: -8px;
            right: 7px;
            font-size: 10px;
            color: var(--muted);
            background: var(--surface);
            padding-left: 3px;
            font-variant-numeric: tabular-nums;
        }
        .event-block {
            position: absolute;
            left: 4px;
            right: 4px;
            padding: 5px 6px;
            text-align: left;
            border: 0;
            border-left: 4px solid rgba(0, 0, 0, .23);
            overflow: hidden;
            box-shadow: 0 2px 7px rgba(30, 25, 70, .11);
        }
        .event-block:hover {
            filter: brightness(.96);
            z-index: 3;
        }
        .event-block.class {
            border-radius: 6px;
        }
        .event-block.activity {
            border-radius: 11px;
            border-left-style: dashed;
        }
        .event-block.sleep {
            border-radius: 5px;
            opacity: .82;
        }
        .event-block.meal {
            border-radius: 999px;
            border-left-style: dotted;
        }
        .event-block.study {
            border-radius: 8px;
            outline: 1px solid rgba(255, 255, 255, .45);
        }
        .event-block .event-icon {
            font-size: 11px;
            margin-right: 3px;
        }
        .event-block .event-name {
            display: block;
            font-size: 11px;
            line-height: 1.18;
            font-weight: 800;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .event-block .event-time {
            display: block;
            margin-top: 1px;
            font-size: 10px;
            opacity: .78;
            overflow: hidden;
            white-space: nowrap;
        }
        .due-badge {
            display: inline-grid;
            min-width: 15px;
            height: 15px;
            padding: 0 3px;
            place-items: center;
            border-radius: 999px;
            background: #e54c63;
            color: white;
            font-size: 9px;
            float: right;
        }
        .important-badge {
            background: #e08a1f;
            margin-right: 3px;
        }
        .reminder-row,
        .plan-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            font-size: 13px;
        }
        .reminder-row.important {
            border-color: #e08a1f;
        }
        .reminder-row .button {
            padding: 3px 8px;
            font-size: 11px;
        }
        .class-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px;
        }
        .class-tile {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 8px;
            text-align: left;
            padding: 26px 22px;
            min-height: 130px;
            border-radius: 16px;
            border: 1px solid var(--line);
            border-left: 5px solid var(--subject, var(--primary));
            background: var(--surface);
        }
        .class-tile:hover {
            background: var(--surface-2);
        }
        .class-tile strong {
            font-size: 19px;
        }
        .class-tile-count {
            color: var(--muted);
            font-size: 12px;
            margin-top: 6px;
        }
        .topic-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 8px 10px;
            border-radius: 10px;
            background: var(--surface-2);
            border: 1px solid var(--line);
            font-size: 13px;
        }
        .topic-row input[type="text"] {
            flex: 1;
        }
        .topic-row .button {
            padding: 4px 8px;
            font-size: 12px;
        }
        .topic-rating-btn {
            background: transparent;
            border: none;
            font-size: 15px;
            padding: 2px 4px;
        }
        .end-day {
            border-top-color: var(--danger);
            border-top-style: dashed;
        }
        .view-range {
            color: var(--muted);
            font-size: 12px;
            font-weight: 650;
        }
        .legend {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding: 12px 17px;
            border-top: 1px solid var(--line);
            font-size: 11px;
            color: var(--muted);
        }
        .legend span {
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .legend i {
            width: 10px;
            height: 10px;
            display: inline-block;
            background: var(--primary);
            border-radius: 3px;
        }
        .legend i.activity {
            border-radius: 5px;
            border-left: 2px dashed rgba(0, 0, 0, .3);
            background: #b8b4cd;
        }
        .legend i.sleep {
            border-radius: 2px;
            background: #9d9aaa;
        }
        .legend i.meal {
            border-radius: 50%;
            background: #e2a844;
        }
        .legend i.study {
            background: #3fa77e;
        }
        .button.info-btn {
            width: 20px;
            height: 20px;
            padding: 0;
            font-size: 12px;
            font-weight: 700;
            border-radius: 50%;
            background: var(--surface-2);
            color: var(--muted);
            border: 1px solid var(--line);
            display: inline-grid;
            place-items: center;
            cursor: help;
        }
        .button.info-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .button.info-btn.light {
            background: rgba(255,255,255,.15);
            color: rgba(255,255,255,.7);
            border-color: rgba(255,255,255,.2);
        }
        .button.info-btn.light:hover {
            background: rgba(255,255,255,.3);
            color: white;
        }
        .pie-tile {
            padding: 12px !important;
            min-height: auto !important;
        }
        .pie-tile .pie-container {
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
        }
        .pie-tile canvas {
            width: 80px;
            height: 80px;
        }
        .pie-tile .pie-legend {
            font-size: 11px;
            gap: 4px;
        }
        .pie-tile .pie-legend span {
            gap: 4px;
        }
        .pie-container {
            display: flex;
            align-items: center;
            gap: 18px;
        }
        .pie-legend {
            display: grid;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
        }
        .pie-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .pie-legend i {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            display: inline-block;
        }
        canvas {
            width: 120px;
            height: 120px;
        }
        .task-page-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 300px;
            gap: 18px;
            align-items: start;
        }
        .task-group {
            padding: 17px;
            margin-bottom: 13px;
        }
        .task-group h2 {
            font-size: 14px;
            margin: 0;
        }
        .group-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .group-head .count {
            color: var(--muted);
            font-size: 12px;
        }
        .side-note {
            padding: 18px;
        }
        .side-note+.side-note {
            margin-top: 14px;
        }
        .side-note ul {
            margin: 10px 0 0;
            padding-left: 18px;
            color: var(--muted);
            font-size: 13px;
        }
        .side-note li+li {
            margin-top: 7px;
        }
        .timetable-info-grid {
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }
        .holiday-list,
        .settings-list {
            display: grid;
            gap: 8px;
        }
        .holiday-row,
        .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 9px;
            padding: 10px;
            border-radius: 11px;
            background: var(--surface-2);
            border: 1px solid var(--line);
        }
        .holiday-row strong,
        .settings-row strong {
            font-size: 13px;
            display: block;
            margin-bottom: 2px;
        }
        .holiday-row span,
        .settings-row span.small {
            color: var(--muted);
            font-size: 11px;
        }
        .fab {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            padding: 0;
            justify-content: center;
            font-size: 24px;
        }
        .modal-layer {
            position: fixed;
            inset: 0;
            z-index: 20;
            display: none;
            place-items: center;
            padding: 18px;
            background: rgba(17, 16, 32, .52);
            backdrop-filter: blur(4px);
        }
        .modal-layer.open {
            display: grid;
        }
        .modal {
            width: min(680px, 100%);
            max-height: calc(100vh - 36px);
            display: flex;
            flex-direction: column;
            border-radius: 20px;
            overflow: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            box-shadow: 0 28px 70px rgba(15, 13, 40, .3);
        }
        .modal.large {
            width: min(820px, 100%);
        }
        .modal-head {
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--line);
            flex-shrink: 0;
        }
        .modal-head h2 {
            margin: 0;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            max-height: 70vh;
        }
        .modal-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--line);
            display: flex;
            justify-content: flex-end;
            gap: 9px;
            flex-shrink: 0;
        }
        .type-picker {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 10px;
        }
        .type-option {
            border: 1px solid var(--line);
            background: var(--surface-2);
            padding: 16px 10px;
            min-height: 94px;
            border-radius: 13px;
            color: var(--text);
            text-align: left;
        }
        .type-option:hover,
        .type-option.selected {
            border-color: var(--primary);
            background: var(--primary-soft);
        }
        .type-option .symbol {
            font-size: 23px;
            display: block;
            margin-bottom: 5px;
        }
        .type-option strong {
            display: block;
            font-size: 13px;
        }
        .type-option span {
            color: var(--muted);
            font-size: 11px;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 13px;
        }
        .form-grid.one {
            grid-template-columns: 1fr;
        }
        .field {
            display: grid;
            gap: 5px;
        }
        .field.span-2 {
            grid-column: span 2;
        }
        label {
            font-size: 12px;
            font-weight: 750;
            color: var(--muted);
        }
        input,
        select,
        textarea {
            width: 100%;
            border: 1px solid var(--line);
            color: var(--text);
            background: var(--surface);
            border-radius: 9px;
            padding: 9px 10px;
        }
        textarea {
            min-height: 72px;
            resize: vertical;
        }
        input[type="color"] {
            padding: 2px;
            height: 38px;
        }
        .switch-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text);
        }
        .switch-row input {
            width: auto;
            accent-color: var(--primary);
        }
        .slot {
            border: 1px solid var(--line);
            background: var(--surface-2);
            border-radius: 13px;
            padding: 12px;
            margin-top: 12px;
        }
        .slot-top {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 9px;
            align-items: end;
        }
        .day-chips {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
            margin-top: 10px;
        }
        .day-chip {
            width: 34px;
            height: 28px;
            border: 1px solid var(--line);
            background: var(--surface);
            color: var(--muted);
            border-radius: 7px;
            font-size: 11px;
            font-weight: 800;
        }
        .day-chip.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .color-picker {
            display: grid;
            grid-template-columns: repeat(10, 22px);
            gap: 1px;
            margin-top: 4px;
        }
        .color-choice {
            width: 22px;
            height: 22px;
            padding: 0;
            border: 2px solid transparent;
            border-radius: 4px;
        }
        .color-choice.selected {
            border-color: var(--text);
            transform: scale(1.15);
            z-index: 1;
        }
        .alert {
            padding: 11px 12px;
            border-radius: 10px;
            font-size: 13px;
            margin-bottom: 13px;
        }
        .alert.danger {
            color: var(--danger);
            background: var(--danger-soft);
        }
        .alert.warning {
            color: var(--warning);
            background: var(--warning-soft);
        }
        .alert.success {
            color: var(--success);
            background: var(--success-soft);
        }
        .event-detail {
            display: grid;
            gap: 13px;
        }
        .event-preview {
            padding: 15px;
            border-radius: 13px;
        }
        .detail-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 9px;
        }
        .detail-grid div {
            padding: 9px;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: var(--surface-2);
        }
        .detail-grid span {
            display: block;
            color: var(--muted);
            font-size: 11px;
        }
        .detail-grid strong {
            font-size: 13px;
        }
        .onboarding {
            text-align: center;
        }
        .onboarding .brand-mark {
            margin: 4px auto 15px;
            width: 46px;
            height: 46px;
            border-radius: 15px;
            font-size: 22px;
        }
        .onboarding p {
            color: var(--muted);
            max-width: 410px;
            margin: 0 auto 18px;
        }
        .toast {
            position: fixed;
            z-index: 30;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: var(--text);
            color: var(--surface);
            padding: 10px 14px;
            font-size: 13px;
            border-radius: 11px;
            opacity: 0;
            transition: .2s;
            pointer-events: none;
            box-shadow: var(--shadow);
        }
        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
        .hidden {
            display: none !important;
        }
        /* AI Chatbot Floating Widget */
        #mascot-widget {
            position: fixed;
            z-index: 60;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: top 0.4s ease, left 0.4s ease, right 0.4s ease, bottom 0.4s ease, opacity 0.3s ease,
                transform 0.3s ease;
            pointer-events: none;
        }
        #mascot-widget.hidden {
            opacity: 0;
            transform: scale(0.85);
            pointer-events: none;
        }
        .mascot-img {
            width: 92px;
            height: auto;
            filter: drop-shadow(0 10px 18px rgba(20, 40, 95, .25));
            animation: mascot-float 3.2s ease-in-out infinite;
            pointer-events: none;
        }
        @keyframes mascot-float {
            0%, 100% {
                transform: translateY(0) rotate(-1deg);
            }
            50% {
                transform: translateY(-8px) rotate(1deg);
            }
        }
        .mascot-bubble {
            max-width: 250px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 16px;
            padding: 12px 14px;
            box-shadow: var(--shadow);
            margin-bottom: 10px;
            font-size: 13px;
            line-height: 1.45;
            color: var(--text);
            pointer-events: auto;
            position: relative;
        }
        .mascot-bubble::after {
            content: "";
            position: absolute;
            bottom: -8px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: var(--surface) transparent transparent;
        }
        .mascot-bubble-actions {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            flex-wrap: wrap;
        }
        .mascot-bubble-actions .button {
            font-size: 12px;
            padding: 6px 10px;
        }
        .mascot-close {
            position: absolute;
            top: -8px;
            right: -8px;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: var(--surface-2);
            border: 1px solid var(--line);
            color: var(--muted);
            font-size: 12px;
            display: grid;
            place-items: center;
        }
        .mascot-highlight {
            outline: 3px solid var(--primary);
            outline-offset: 3px;
            box-shadow: 0 0 0 6px rgba(46, 99, 246, .18);
            transition: outline-color .2s, box-shadow .2s;
            position: relative;
            z-index: 45;
        }
        #ai-chat-widget {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 50;
            font-family: inherit;
        }
        #ai-chat-toggle {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #6EA0FF);
            color: white;
            border: none;
            box-shadow: 0 8px 24px rgba(46, 99, 246, 0.35);
            font-size: 16px;
            font-weight: 800;
            display: grid;
            place-items: center;
            transition: transform 0.2s;
            padding: 6px;
            overflow: hidden;
        }
        #ai-chat-toggle img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center 15%;
        }
        #ai-chat-toggle:hover {
            transform: scale(1.05);
        }
        #ai-chat-panel {
            position: absolute;
            bottom: 80px;
            right: 0;
            width: min(380px, calc(100vw - 48px));
            height: 500px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: opacity 0.2s, transform 0.2s;
        }
        #ai-chat-panel.hidden {
            opacity: 0;
            pointer-events: none;
            transform: translateY(15px);
        }
        .ai-chat-header {
            background: var(--surface-2);
            padding: 16px;
            border-bottom: 1px solid var(--line);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
        }
        .ai-chat-header button {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 20px;
        }
        .ai-chat-header-actions {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .ai-chat-header-actions #ai-chat-clear {
            font-size: 15px;
        }
        #ai-chat-history {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .ai-message {
            padding: 12px 16px;
            border-radius: 14px;
            font-size: 14px;
            max-width: 85%;
            line-height: 1.4;
        }
        .ai-message.system {
            background: var(--surface-2);
            color: var(--text);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            position: relative;
            margin-left: 32px;
        }
        .ai-message.system::before {
            content: '';
            position: absolute;
            left: -32px;
            bottom: -2px;
            width: 26px;
            height: 26px;
            background-image: var(--mascot-avatar-url);
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center bottom;
        }
        .ai-message.user {
            background: var(--primary);
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        .ai-message.loading {
            color: var(--muted);
            font-style: italic;
            background: transparent;
        }
        .ai-message img {
            display: block;
            max-width: 100%;
            border-radius: 10px;
            margin-bottom: 6px;
        }
        .ai-confirm-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .ai-confirm-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: none;
            font-size: 15px;
            font-weight: 800;
            display: grid;
            place-items: center;
            cursor: pointer;
        }
        .ai-confirm-btn.yes {
            background: #2D9B6C;
            color: white;
        }
        .ai-confirm-btn.no {
            background: #e54c63;
            color: white;
        }
        .picker-field {
            width: 100%;
            text-align: left;
            border: 1px solid var(--line);
            color: var(--text);
            background: var(--surface);
            border-radius: 9px;
            padding: 9px 10px;
            font: inherit;
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
        }
        .picker-field:hover,
        .picker-field.open {
            border-color: var(--primary);
        }
        .picker-field .placeholder {
            color: var(--muted);
        }
        .picker-popover {
            position: fixed;
            z-index: 999;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: 0 18px 44px rgba(0, 0, 0, .28);
            padding: 12px;
            width: 264px;
        }
        .picker-popover.hidden {
            display: none;
        }
        .picker-cal-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
            font-weight: 750;
            font-size: 13px;
        }
        .picker-cal-head button {
            background: var(--surface-2);
            border: none;
            color: var(--text);
            width: 28px;
            height: 28px;
            border-radius: 8px;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        .picker-cal-head strong {
            flex-shrink: 0;
        }
        .picker-year-select {
            flex: 1;
            margin: 0 6px;
            padding: 5px 6px;
            font-size: 12px;
            font-weight: 700;
        }
        .picker-cal-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 3px;
            text-align: center;
        }
        .picker-cal-dow {
            font-size: 10px;
            font-weight: 750;
            color: var(--muted);
            padding-bottom: 4px;
        }
        .picker-cal-day {
            background: transparent;
            border: none;
            color: var(--text);
            border-radius: 8px;
            height: 32px;
            font-size: 12px;
        }
        .picker-cal-day:hover {
            background: var(--surface-2);
        }
        .picker-cal-day.today {
            font-weight: 800;
            color: var(--primary);
        }
        .picker-cal-day.selected {
            background: var(--primary);
            color: white;
        }
        .picker-cal-foot {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .picker-cal-foot .button {
            flex: 1;
            padding: 7px;
            font-size: 12px;
        }
        .picker-time-preview {
            text-align: center;
            font-size: 22px;
            font-weight: 800;
            padding: 6px 0 14px;
            color: var(--primary);
        }
        .picker-time-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .picker-time-fields label {
            display: block;
            margin-bottom: 4px;
        }
        .ai-chat-attachment {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            border-top: 1px solid var(--line);
            background: var(--surface-2);
        }
        .ai-chat-attachment.hidden {
            display: none;
        }
        .ai-chat-attachment img {
            width: 36px;
            height: 36px;
            object-fit: cover;
            border-radius: 8px;
        }
        .ai-chat-attachment span {
            flex: 1;
            color: var(--muted);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .ai-chat-input-area {
            padding: 16px;
            border-top: 1px solid var(--line);
            display: flex;
            gap: 8px;
            background: var(--surface);
        }
        .ai-chat-input-area input[type="text"] {
            flex: 1;
            border-radius: 20px;
            padding: 10px 16px;
            font-size: 14px;
        }
        #ai-chat-attach {
            background: var(--surface-2);
            color: var(--text);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex-shrink: 0;
            font-size: 16px;
            overflow: hidden;
            padding: 3px;
        }
        #ai-chat-attach img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            object-position: center 20%;
        }
        .ai-chat-header-icon {
            width: 22px;
            height: 22px;
            object-fit: contain;
            object-position: center 15%;
            vertical-align: -5px;
            margin-right: 6px;
        }
        #ai-chat-send {
            background: var(--primary);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: grid;
            place-items: center;
            flex-shrink: 0;
        }
        @media (max-width: 1100px) {
            .timetable-info-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 980px) {
            .sidebar {
                width: 68px;
                padding-left: 10px;
                padding-right: 10px;
            }
            main {
                margin-left: 68px;
            }
            .brand .brand-label,
            .nav span,
            .sidebar-footer span {
                display: none;
            }
            .brand {
                justify-content: center;
                padding: 0;
            }
            .nav button,
            .sidebar-footer button {
                justify-content: center;
                padding-left: 0;
                padding-right: 0;
            }
            .stats {
                grid-template-columns: repeat(2, 1fr);
            }
            .task-page-grid,
            .timetable-info-grid {
                grid-template-columns: 1fr;
            }
        }
        @media (max-width: 620px) {
            main {
                padding: 20px 0 38px;
            }
            :root {
                --main-px: 13px;
            }
            .page-header {
                display: grid;
            }
            .toolbar {
                justify-content: flex-start;
            }
            .stats {
                gap: 9px;
            }
            .stat {
                min-height: 110px;
                padding: 14px;
            }
            .stat .value {
                font-size: 23px;
            }
            .section {
                padding: 14px;
            }
            .form-grid,
            .type-picker {
                grid-template-columns: 1fr 1fr;
            }
            .field.span-2 {
                grid-column: span 2;
            }
            .modal-body {
                padding: 15px;
            }
            .modal-head,
            .modal-foot {
                padding-left: 15px;
                padding-right: 15px;
            }
        }
        @media (max-width: 400px) {
            .sidebar {
                width: 56px;
                padding-left: 7px;
                padding-right: 7px;
            }
            main {
                margin-left: 56px;
            }
            .form-grid,
            .type-picker {
                grid-template-columns: 1fr;
            }
            .field.span-2 {
                grid-column: auto;
            }
            .stats {
                grid-template-columns: 1fr 1fr;
            }
            .button {
                padding: 8px 9px;
            }
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <div id="modal-layer" class="modal-layer" aria-hidden="true"></div>
    <div id="picker-popover" class="picker-popover hidden"></div>
    <div id="toast" class="toast" role="status"></div>

    <!-- Mascot guide -->
    <div id="mascot-widget" class="hidden" role="status" aria-live="polite">
        <div class="mascot-bubble" id="mascot-bubble">
            <button type="button" class="mascot-close" id="mascot-close" aria-label="Dismiss">×</button>
            <div id="mascot-bubble-text"></div>
            <div class="mascot-bubble-actions" id="mascot-bubble-actions"></div>
        </div>
        <img class="mascot-img" id="mascot-img" src="" alt="Study buddy">
    </div>

    <!-- AI Assistant UI -->
    <div id="ai-chat-widget">
        <button id="ai-chat-toggle" aria-label="Toggle AI Chat"><img id="ai-chat-toggle-img" src="" alt=""></button>
        <div id="ai-chat-panel" class="hidden">
            <div class="ai-chat-header">
                <h3><img id="ai-chat-header-icon" class="ai-chat-header-icon" src="" alt="">Sparky</h3>
                <div class="ai-chat-header-actions">
                    <button id="ai-chat-clear" type="button" aria-label="Clear chat" title="Clear chat">🗑</button>
                    <button id="ai-chat-close" aria-label="Close chat">×</button>
                </div>

            const uid = () => `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,7)}`;
            const localDate = (d = new Date()) => {
                const x = new Date(d);

            };
            const dateFrom = (s) => { const [y, m, d] = String(s).split('-').map(Number); return new Date(y, m - 1,
                d); };
            const addDays = (s, n) => { const d = typeof s === 'string' ? dateFrom(s) : new Date(s);
                d.setDate(d.getDate() + n); return localDate(d); };
            const fmtDate = (s, options = { month: 'short', day: 'numeric' }) => dateFrom(s).toLocaleDateString(
                undefined, options);
            const mins = (time) => { const [h, m] = String(time || '00:00').split(':').map(Number); return h * 60 + m; };
            const time = (value) => { value = ((value % 1440) + 1440) % 1440;
                const h = Math.floor(value / 60),
                    m = value % 60; return `${h%12||12}:${String(m).padStart(2,'0')} ${h<12?'AM':'PM'}`; };
            const duration = (start, end) => { let x = mins(end) - mins(start); return x <= 0 ? x + 1440 : x; };
            const fmtMins = (n) => { n = Math.max(0, Math.round(n));
                const h = Math.floor(n / 60),
                    m = n % 60; return h && m ? `${h}h ${m}m` : h ? `${h}h` : `${m}m`; };
            const mondayIndex = (date) => { const js = dateFrom(date).getDay(); return js === 0 ? 6 : js - 1; };
            const weekStart = (date) => addDays(date, -mondayIndex(date));
            const range = (start, count) => Array.from({ length: count }, (_, i) => addDays(start, i));
            const clamp = (x, min, max) => Math.max(min, Math.min(max, x));
            const clampDate = (d, min, max) => d < min ? min : d > max ? max : d;
            const escape = (x) => String(x ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;',
                "'": '&#39;', '"': '&quot;' }[c]));
            const contrast = (hex) => { const c = hex.replace('#', '');
                const r = parseInt(c.slice(0, 2), 16),
                    g = parseInt(c.slice(2, 4), 16),
                    b = parseInt(c.slice(4, 6), 16); return ((r * 299 + g * 587 + b * 114) / 1000) > 158 ? '#20202b' :
                    '#fff'; };

            // --- Custom date/time picker -------------------------------------------------
            // Every date/time field in the app is a <button class="picker-field"> immediately followed by an
            // <input type="hidden"> holding the real ISO value — so all existing save*()/read code that does
            // document.getElementById(id).value or el.querySelector('.slot-start').value keeps working unchanged.
            let openPicker = null; // { type: 'date'|'time', input, button, viewDate }
            const pickerPopover = document.getElementById('picker-popover');

            function dateDisplay(v) { return v ? fmtDate(v, { weekday: 'short', day: 'numeric', month: 'short',
                    year: 'numeric' }) : 'Choose a date'; }

            function timeDisplay(v) { return v ? time(mins(v)) : 'Choose a time'; }

            function pickerFieldHtml(hiddenAttrs, kind, value) { return `<button type="button" class="picker-field" data-action="open-picker" data-type="${kind}"><span${value?'':' class="placeholder"'}>${kind==='date'?dateDisplay(value):timeDisplay(value)}</span> ${kind==='date'?'📅':'🕐'}</button><input type="hidden" ${hiddenAttrs} value="${escape(value||'')}">`; }

            function positionPopover(button) { const r = button.getBoundingClientRect(),
                    pw = 264, vh = window.innerHeight, vw = window.innerWidth; let top = r.bottom + 6,
                    left = r.left; if (left + pw > vw - 8) left = vw - pw - 8; if (left < 8) left = 8; if (top +
                    260 > vh) top = Math.max(8, r.top - 266);
                pickerPopover.style.top = `${top}px`;
                pickerPopover.style.left = `${left}px`; }

            function closePicker() { if (!openPicker) return;
                openPicker.button.classList.remove('open');
                pickerPopover.classList.add('hidden');
                pickerPopover.innerHTML = '';
                openPicker = null; }

            function commitPicker(value) { const { input, button, type } = openPicker;
                input.value = value; const span = button.querySelector('span');
                span.textContent = type === 'date' ? dateDisplay(value) : timeDisplay(value);
                span.classList.remove('placeholder');
                closePicker(); }

            function renderCalendar() { const view = dateFrom(openPicker.viewDate),
                    year = view.getFullYear(), month = view.getMonth(),
                    first = new Date(year, month, 1), startOffset = (first.getDay() + 6) % 7, // Monday-first
                    daysInMonth = new Date(year, month + 1, 0).getDate(), today = localDate(),
                    selected = openPicker.input.value,
                    monthLabel = first.toLocaleDateString(undefined, { month: 'long' }),
                    thisYear = new Date().getFullYear(),
                    yearOptions = Array.from({ length: 112 }, (_, i) => thisYear - 100 + i);
                const cells = []; for (let i = 0; i < startOffset; i++) cells.push(null); for (let d = 1; d <=
                    daysInMonth; d++) cells.push(`${year}-${String(month+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`);
                pickerPopover.innerHTML = `<div class="picker-cal-head"><button type="button" data-action="picker-cal-nav" data-dir="-1" aria-label="Previous month">‹</button><strong>${monthLabel}</strong><select class="picker-year-select">${yearOptions.map(y=>`<option value="${y}" ${y===year?'selected':''}>${y}</option>`).join('')}</select><button type="button" data-action="picker-cal-nav" data-dir="1" aria-label="Next month">›</button></div><div class="picker-cal-grid">${DAY_NAMES.map(d=>`<span class="picker-cal-dow">${d[0]}</span>`).join('')}${cells.map(c=>c?`<button type="button" class="picker-cal-day ${c===selected?'selected':''} ${c===today?'today':''}" data-action="picker-cal-pick" data-date="${c}">${Number(c.slice(8))}</button>`:'<span></span>').join('')}</div><div class="picker-cal-foot"><button type="button" class="button ghost" data-action="picker-cal-today">Today</button><button type="button" class="button ghost" data-action="picker-cal-clear">Clear</button></div>`; }

            function renderTimeList() { const [hStr, mStr] = (openPicker.input.value || '09:00').split(':'),
                    hours = Array.from({ length: 24 }, (_, i) => String(i).padStart(2, '0')),
                    minutes = ['00', '05', '10', '15', '20', '25', '30', '35', '40', '45', '50', '55'];
                pickerPopover.innerHTML = `<div class="picker-time-preview" id="picker-time-preview">${time(mins(`${hStr}:${mStr}`))}</div><div class="picker-time-fields"><div class="field"><label>Hour</label><select class="picker-time-hour">${hours.map(h=>`<option value="${h}" ${h===hStr?'selected':''}>${h}</option>`).join('')}</select></div><div class="field"><label>Minute</label><select class="picker-time-minute">${minutes.map(m=>`<option value="${m}" ${m===mStr?'selected':''}>${m}</option>`).join('')}</select></div></div><button type="button" class="button primary" style="width:100%;margin-top:12px" data-action="picker-time-set">Set time</button>`; }

            function openDatePicker(button) { const input = button.nextElementSibling;
                openPicker = { type: 'date', input, button, viewDate: input.value || localDate() };
                button.classList.add('open');
                renderCalendar();
                pickerPopover.classList.remove('hidden');
                positionPopover(button); }

            function openTimePicker(button) { const input = button.nextElementSibling;
                openPicker = { type: 'time', input, button };
                button.classList.add('open');

                pickerPopover.classList.remove('hidden');
