                    }
                },

                update_task: {
                    description: "Edit an existing task. Get the id from read_app_state first.",
                    parameters: {
                        type: "OBJECT",
                        properties: { id: { type: "STRING" }, patch: { type: "OBJECT", description: "Any of title, type, subjectId, due, minutes, online, important, details, done." } },
                        required: ["id", "patch"]
                    },
                    handler: (args) => {
                        const existing = state.tasks.find(t => t.id === args.id);
                        if (!existing) return { error: "No task found with that id." };
                        const { done, ...rest } = args.patch || {};
                        Object.assign(existing, rest);
                        if (typeof done === "boolean") setTaskDone(existing, done);
                        state.tasks = state.tasks.map(t => t.id === existing.id ? existing : t);
                        save(); render();
                        toast(`AI updated task "${existing.title}".`);
                        return { success: true, task: existing };
                    }
                },

                delete_task: {
                    description: "Delete a task permanently.",
                    parameters: { type: "OBJECT", properties: { id: { type: "STRING" } }, required: ["id"] },
                    handler: (args) => {
                        const existing = state.tasks.find(t => t.id === args.id);
                        if (!existing) return { error: "No task found with that id." };
                        state.tasks = state.tasks.filter(t => t.id !== args.id);
                        save(); render();
                        toast(`AI deleted task "${existing.title}".`);
                        return { success: true };
                    }
                },

                toggle_task_done: {
                    description: "Mark a task as done, or move it back to not-done. Marking homework/a project done automatically creates a 'bring this in' reminder for that subject's next class.",
                    parameters: { type: "OBJECT", properties: { id: { type: "STRING" }, done: { type: "BOOLEAN", description: "Optional. If omitted, flips the current state." } }, required: ["id"] },
                    handler: (args) => {
                        const existing = state.tasks.find(t => t.id === args.id);

                update_settings: {
                    description: "Change app-wide settings: name, date of birth, year group, school term dates, dark/light theme, or sidebar behaviour. Free study time is derived automatically from the user's actual sleep events rather than a fixed window, so there's nothing to configure there.",
                    parameters: {

                            'string') next.firstName = patch.firstName; if (typeof patch.lastName === 'string')
                            next.lastName = patch.lastName; if (typeof patch.dob === 'string') next.dob = patch.dob; if (
                            YEAR_GROUPS.includes(patch.yearGroup)) next.yearGroup = patch.yearGroup; if (typeof patch
                            .termStart === 'string') next.termStart = patch.termStart; if (typeof patch.termEnd ===
                            'string') next.termEnd = patch.termEnd; if (patch.theme === 'dark' || patch.theme ===
                            'light') next.theme = patch.theme; if (['hover', 'expanded', 'collapsed'].includes(patch
                                .sidebarMode)) next.sidebarMode = patch.sidebarMode;
                        state.settings = next;
                        save(); render();
                        toast("AI updated your settings.");
                        return { success: true, settings: state.settings };

                update_subject: {
                    description: "Edit a subject: rename it, change its weekly target minutes, colour, whether it's active, whether it's an exam subject, or its study-method category. Note: for subjects tied to a class, renaming here won't rename the class event itself — prefer update_event on the class for name changes so they stay in sync.",
                    parameters: {
                        type: "OBJECT",
                        properties: { id: { type: "STRING" }, patch: { type: "OBJECT", description: "Any of name, target (minutes/week), color, active (boolean), examSubject (boolean — false means it's excluded from spare-time study filling, e.g. SPHE or PE; homework for it is unaffected), category ('stem'|'language'|'humanities'|'practical'|'other' — every subject gets a guessed category automatically from its name, but correct it here if the guess looks wrong, e.g. an unusually-named class or a subject not on the standard JC/LC list)." } },
                        required: ["id", "patch"]
                    },
                    handler: (args) => {
                        const s = subject(args.id);
                        if (!s) return { error: "No subject found with that id." };
                        if (args.patch && args.patch.category && !["stem", "language", "humanities", "practical", "other"].includes(args.patch.category)) return { error: "category must be one of stem, language, humanities, practical, other." };
                        Object.assign(s, args.patch || {});
                        // Class blocks render using the event's own color field, not the subject's — a subject
                        // color change needs to propagate to its linked class event or it won't visibly do anything.
                        if (args.patch && args.patch.color) state.events.forEach(e => { if (e.type === "class" &&
                                e.subjectId === args.id) e.color = s.color; });
                        save(); render();

                find_free_slot: {
                    description: "Find the next free window of at least the given length, searching the user's real free time (their waking hours outside sleep, classes, and other events) over the next few weeks. Use this before add_event when the user hasn't specified an exact time, to avoid clashes.",
                    parameters: { type: "OBJECT", properties: { minutes: { type: "INTEGER", description: "Minimum length needed, in minutes. Defaults to the user's usual session length." } } },
                    handler: (args) => {
                        const slot = findSlot(args.minutes || DEFAULT_SESSION_MIN);
                        if (!slot) return { error: "No free slot found in the next few weeks. Try a shorter duration, or check whether their sleep events leave enough waking time." };
                        const fmt = (m) => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
                        return { success: true, date: slot.date, dayName: DAY_NAMES[mondayIndex(slot.date)], start: fmt(slot.start), end: fmt(slot.end) };
                    }
                },

                auto_plan: {
                    description: "Automatically schedule the single most urgent/recommended study session (based on the app's own cushion and spacing logic) into the next free slot. Use when the user asks the app to 'just plan something' or 'fill a gap' without specifying what.",
                    parameters: { type: "OBJECT", properties: {} },
                    handler: () => {

                },

                add_exam: {
                    description: "Add a test or an exam period. A test is one subject on one day (assessmentType 'test', start and end the same date, exactly one sitting). An exam runs over a date range with several subjects sitting at their own day/time within it (assessmentType 'exam', kind Christmas/Summer/Mock/Junior Cert/Leaving Cert/Other). Skip subjects the user isn't sitting — homework for a skipped subject is unaffected, it just isn't building up to this assessment. Once added, each subject's own sitting date is weighted more heavily inside the user's existing study blocks as it approaches. You can optionally attach classTopic ids to a sitting (from read_app_state's classTopics, matched by subjectId) to tell the study engine exactly what's being tested — not available for kind jc/lc/mock since those cover everything the subject has taught; leave sittings[].topics empty and topicsUnknown false for those.",
                    parameters: {
                        type: "OBJECT",
                        properties: {
                            assessmentType: { type: "STRING", enum: ["test", "exam"], description: "Defaults to 'exam' if omitted." },
                            kind: { type: "STRING", enum: EXAM_KINDS.map(k => k.id), description: "Required for assessmentType 'exam'. 'other' requires a custom name. Ignored for tests." },
                            name: { type: "STRING", description: "Custom name — only used (and required) when kind is 'other'. For tests, defaults to the subject's name." },
                            start: { type: "STRING", description: "YYYY-MM-DD. First day of the exam period, or the single test date." },
                            end: { type: "STRING", description: "YYYY-MM-DD. Last day of the exam period, or the same as start for a test." },
                            sittings: {
                                type: "ARRAY",
                                description: "One entry per subject actually being sat. For a test, exactly one entry. Get subjectId from read_app_state's subjects list — remember a class's name IS its subject.",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        subjectId: { type: "STRING" },
                                        date: { type: "STRING", description: "YYYY-MM-DD, within start–end." },
                                        time: { type: "STRING", description: "24h HH:MM. Required for an exam sitting. Optional for a test — if omitted, it's derived automatically from that subject's usual class time on that date." },
                                        topics: { type: "ARRAY", items: { type: "STRING" }, description: "Optional classTopic ids covered by this sitting. Not applicable for exam kinds jc/lc/mock." },
                                        topicsUnknown: { type: "BOOLEAN", description: "True if it could be anything already covered — mutually exclusive with topics." }
                                    }
                                }
                            }
                        },
                        required: ["start", "end"]
                    },
                    handler: (args) => {
                        const assessmentType = args.assessmentType === "test" ? "test" : "exam";
                        if (assessmentType === "exam" && !EXAM_KINDS.some(k => k.id === args.kind)) return { error: `Invalid kind. Valid kinds: ${EXAM_KINDS.map(k=>k.id).join(", ")}` };
                        if (!args.start || !args.end) return { error: "Provide a start and end date (YYYY-MM-DD)." };
                        if (assessmentType === "exam" && args.kind === "other" && !args.name) return { error: "Exams with kind 'other' need a custom name." };
                        if (assessmentType === "test") { const s0 = (args.sittings || [])[0]; if (s0 && s0.subjectId &&
                                s0.date && !s0.time) { const hasAnyClass = state.events.some(e => e.type === "class" &&
                                    e.subjectId === s0.subjectId); if (hasAnyClass && !classTimeOnDate(s0.subjectId,
                                        s0.date)) return { error: "That subject doesn't have a class on that date — pick a date it actually meets, or ask the user which day is right." }; } }
                        const topicsAllowed = assessmentType === "test" || !["jc", "lc", "mock"].includes(args.kind);
                        const sittings = (args.sittings || []).filter(s => s.subjectId && s.date).map(s => ({
                            subjectId: s.subjectId, date: s.date,
                            time: s.time || (assessmentType === "test" ? (classTimeOnDate(s.subjectId, s.date) || "09:30") : ""),
                            topics: topicsAllowed && !s.topicsUnknown ? (s.topics || []).filter(id => state.classTopics.some(t => t.id === id)) : [],
                            topicsUnknown: topicsAllowed ? !!s.topicsUnknown : false })).filter(s => s.time);
                        if (assessmentType === "test" && sittings.length !== 1) return { error: "A test needs exactly one sitting (one subject)." };
                        const exam = { id: uid(), assessmentType, kind: assessmentType === "test" ? "test" : args.kind,
                            name: assessmentType === "exam" && args.kind === "other" ? args.name : "",
                            start: args.start, end: args.end, sittings };
                        state.exams.push(exam);
                        invalidateFutureStudyPlans();
                        save(); render();
                        toast(`AI added "${examDisplayName(exam)}" to Tests & Exams.`);
                        return { success: true, exam };
                    }
                },

                update_exam: {

Today's date is ${localDate()} (${DAY_NAMES[mondayIndex(localDate())]}).

How you write matters as much as what you do. The chat bubble renders plain text only — no markdown, so *asterisks*, **bold**, bullet lists, and headers all show up as literal punctuation, not formatting. Never use markdown syntax. Keep every reply short: a sentence or two for normal chat, and for confirmations or "here's what I did" summaries, one brief sentence covering the shape of it (how many classes, which subjects, anything unusual) rather than listing every single time slot — the user can already see the details on their timetable, so your job is a quick, readable summary, not a transcript. When you ask the user to confirm something (see the [CONFIRM] rules below), the question must always be answerable with a plain yes or no — end it with something like "Is that right?" or "Should I go ahead?", never an open question with multiple options, since the only way the user can reply is by tapping a ✓ or ✗ button.

The app tracks, per user: settings (name, date of birth, year group, school term dates, theme, sidebar behaviour), subjects, timetable events (classes, activities, sleep, meals, study blocks — each with one or more weekly or one-off time slots), tasks (homework/tests/projects with due dates), exams (each with a date range and per-subject sitting times), reminders (short "don't forget" notes tied to a specific class occurrence), spaced-repetition topics, and holidays/days-off. There are no manually-configured study-time windows — free time for scheduling is worked out automatically from each day's actual sleep events (or a 07:00–23:00 fallback if none is set).

Subjects are not managed separately any more — a "class" event's name IS its subject. Adding or renaming a class automatically creates or matches a subject with that exact name (case-insensitive), so when calling add_event or update_event for a class you should just set its name and not worry about subjectId. Each subject also has an examSubject flag (default true, settable via the class event or update_subject): subjects with examSubject false (e.g. SPHE, PE) still get their homework scheduled into study blocks normally, but are skipped by the automatic "fill spare study time by subject balance" pass, since the user has no exam in them.

Most day-to-day study planning is fully automatic and lives on the Study page, not in chat: any timetable event of type "study" is a study block, and the app fills each one with what to actually study — drawing on tasks due soon, spaced-repetition topics that are due for review, and how each subject is tracking against its weekly target (boosted automatically as a real exam gets closer, once the user has added it via add_exam). The user checks in after a block with what they actually studied, which schedules it for review later. You don't need to build this plan yourself; your role in this area is mainly to add/edit exams, skip a missed study block occurrence with skip_event_occurrence (the Study page will naturally re-plan the displaced content into upcoming blocks), suggest alternative times with find_replacement_options when the user can't make something, and log a study session on their behalf with log_study_topic if they mention what they studied in chat.

Study blocks come in two kinds: self study (studyKind 'self', skippable: true, the default) and supervised study (studyKind 'supervised', skippable: false — e.g. a compulsory school study hall the user genuinely cannot skip regardless of other plans). Only supervised study should really live directly on the timetable as a fixed block — self study time is better suggested/created by you in the user's actual free time, guided by their study preferences (see below), rather than the user having to manually block out every self-study session themselves. Always check which kind an existing block is before agreeing to skip or move one — skip_event_occurrence will refuse a non-skippable block unless you pass force: true, and you should only do that after telling the user it's normally mandatory and having them confirm they still want to.

There's also a separate, fully automatic self-study planner (the Dashboard's "Refresh self-study plan" button, plus a roughly-hourly background check) that adjusts self-study block volume on its own using a deterministic formula — not you — based on study preferences, CAO trajectory, exam proximity, and topic/result data. It only ever touches blocks it created itself (never anything the user or you placed by hand). If asked how much self-study is scheduled or why a self-study block appeared/changed on its own, mention that system exists and point to the refresh button rather than trying to explain or override its reasoning yourself — you don't have visibility into its internal scoring.

The user can set study preferences (settings.studyPreferences, visible via read_app_state): intensity (light/moderate/intense — roughly light ~3-5h/week, moderate ~6-10h/week, intense ~10-15h+/week of self-directed study, on top of any supervised study blocks), pointsTarget (only meaningful for 5th/6th years), timeOfDay (morning/afternoon/evening/flexible), weekendBalance (weekday/weekend/even), and a freeform notes field the user can use for anything that doesn't fit a dropdown (e.g. "I'd rather study late on Saturday and keep Sunday free") — treat notes as genuine context to factor in, not just decoration. When you create or suggest self-directed study blocks, use these to guide how much total weekly study to suggest and which free times to prefer; don't feel obliged to hit an exact number, just let the preferences steer you sensibly. If the preferences are all empty, use open_study_preferences_form to offer the user a chance to set them rather than guessing.

When the user has just finished onboarding and their timetable is empty, you'll be prompted internally to start a guided setup conversation — this is the first message they'll see, so keep it warm and brief. Ask plainly whether they have a photo of their class timetable (or exam timetable) to send, or would rather build it by hand — this is a genuine two-way choice, not a [CONFIRM] yes/no. Then:

Reminders (short "bring this in" notes tied to one specific class occurrence, visible in read_app_state) are a UI-only feature — completing homework creates them automatically and the user manages them by hand, so there's no tool for you to create or dismiss one directly. If a user mentions something they need to remember for a class, just tell them to add it from that class's details on the Dashboard rather than trying to do it yourself.

When a user asks how to do something in the app and it matches one of show_mascot_tour's tours, use that instead of typing out step-by-step instructions — a visual walkthrough pointing at the real button beats a wall of text. Keep your own message short (a sentence acknowledging what you're about to show them) since the tour itself does the explaining; don't repeat the tour's content in chat too.

Class topics (classTopics, on the Classes page) track what's actually being covered in each class — this is what the Study page uses to know what to schedule, separate from the homework/task system. If the user mentions what they covered in class (e.g. "we did quadratic equations in maths today"), use add_class_topic — it's much more useful to the study engine than a vague task. Move it along with update_class_topic as things change: status 'done' once the class has finished a topic (defaults its rating to 'ok' until the user or an exam result says otherwise), 'paused' if the teacher will return to it later, back to 'learning' if it's being revisited. When a real test or exam has topics assigned, you can also attach classTopic ids to a sitting via add_exam/update_exam, and record_exam_result's topicResults lets you mark individual topics right/mixed/wrong from that result, which updates their rating automatically.

Tests and exams are both stored via add_exam/update_exam (assessmentType 'test' or 'exam') and live on their own Tests & Exams page, not the task list — don't use add_task for a test, even though "test" might feel like a task. A test is one subject, one day; an exam is a period where several subjects sit at their own times.

Sometimes the user will attach a photo of a paper or online timetable, or an exam schedule, instead of typing. Never add anything from a photo without confirming first — this is a strict two-step gate:
- Step 1 — identify: look at the image, say plainly what you think it is in one short sentence, then ask "Is that right?" (e.g. "This looks like a weekly class timetable. Is that right?"). End that message with the literal text [CONFIRM] on its own so the user gets a yes/no button instead of having to type. Do not call read_app_state or any other tool yet.
- If they say no: ask them what the image actually is, or what they'd like you to do with it instead, and drop the two-step flow — just help with whatever they clarify.
- If they say yes: now call read_app_state so you know what already exists, briefly say what you're proposing to add in one short sentence, then ask "Should I go ahead?" (e.g. "I can add 7 classes and 3 exam sittings from this. Should I go ahead?"), and end that message with [CONFIRM] too.

Once confirmed, turn the photo into real data using your tools:
- Don't create duplicates of a class that's already there (e.g. if "Maths" already exists as a class, prefer update_event on it over adding a second "Maths" class), and don't recreate an exam that's already listed.
- For a weekly class timetable: for each subject, group its weekly occurrences into as few add_event calls as possible — one add_event per subject, with one slot per distinct start/end time and the days that share that time (e.g. Maths at 09:00–09:50 on Mon/Tue/Thu/Fri and 09:00–10:40 on Wed can be two slots in a single add_event, using days 0=Monday..6=Sunday). Remember a class's name IS its subject — do not pass subjectId, just set an accurate name (use the full subject name if you can infer it from an abbreviation, e.g. "Ir" → "Irish").
- For an exam timetable/schedule sheet: this is usually one exam period (e.g. "5th Year Christmas Exams") covering a date range, with each subject sitting at its own day and time within it — an exam timetable typically lists every subject the year group takes, but the user only sits some of them, so only include sittings for subjects that are also one of their classes (check read_app_state's subjects list; skip the rest). Call add_exam once for the period with kind (christmas/summer/mock/jc/lc/other — 'other' needs a custom name) and start/end dates, and a sittings array with one {subjectId, date, time} per subject they're actually sitting.
- If parts of the photo are blurry, cropped, or ambiguous (unclear day, unclear time, unreadable subject name), don't guess silently — add what you're confident about, then ask the user to clarify the rest in your reply rather than inventing values.
- When you're done, give a one-sentence summary, not a list (e.g. "Added 7 classes and 3 exams — the Wednesday Music time was unclear, could you check it?").

The [CONFIRM] marker is only for these photo-identification/action-proposal moments — don't use it for ordinary chat questions, and never use it to ask something the user would have to type an answer to (it only ever means yes/no).

For everything else you can take real action in the app using the tools available to you — adding, editing, or deleting timetable events, tasks, holidays, exams, and settings; finding free time; switching views; and changing which week is shown. Always prefer the specific tool for a job (e.g. add_event) over the generic apply_state_patch escape hatch, which exists only for things the other tools don't cover.

Call read_app_state whenever you need real ids or the actual current schedule before making a change — never guess an id or assume what's already on the timetable. When a request is ambiguous about timing, use find_free_slot or find_replacement_options rather than guessing a time that might clash. After taking action, briefly confirm in plain, friendly language what you did — you don't need to narrate which tool you called.

If the user asks about how to study or study methods generally, answer from your own knowledge, briefly and adapted to their actual question — the app's Study page plans the specifics automatically now, so you don't need to (and there's no embedded personal study guide to draw from any more).`;

            async function sendConfirmReply(text, row) {
                row.remove();

                try { await processUserPrompt(text, loadingMsg); } catch (error) { console.error('AI Error:', error);

            async function handleUserPrompt() {

                if (!text && !image) return;
                appendMessage(text, 'user', image?.dataUrl);

                clearPendingImage();
                const loadingMsg = appendMessage(image ? "Reading your photo..." : "Thinking...", "system loading");
                try {
                    await processUserPrompt(text, loadingMsg, image);
                } catch (error) {
                    console.error("AI Error:", error);

                } finally {

            async function callGemini() {
                if (GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                    throw new Error("API key not set. Get one free from https://aistudio.google.com, then replace YOUR_GEMINI_API_KEY_HERE in this file.");
                }
                // Only the most recent GENUINE user turn decides which model to use (tool-response turns are also
                // pushed with role "user" — see the note in processUserPrompt — so they're excluded here via the
                // _toolResult marker). Once the conversation moves past a photo onto plain text follow-ups, this
                // drops back to the cheap/fast text model rather than sticking on the vision model for the rest
                // of the session.
                const lastUserTurn = [...aiConversation].reverse().find(t => t.role === "user" && !t._toolResult);
                const usesVision = !!(lastUserTurn && (lastUserTurn.parts || []).some(p => p.inlineData));
                // Text requests fall back to the older 3.1 flash-lite once the daily limit on 3.5 flash-lite is
                // hit (separate free-tier quota bucket on the same key) — roughly doubles effective daily usage.
                // Vision has no fallback since there's no non-lite 3.1 flash model.
                const models = usesVision ? [GEMINI_MODEL_VISION] : [GEMINI_MODEL_TEXT, GEMINI_MODEL_TEXT_FALLBACK];
                for (let i = 0; i < models.length; i++) {
                    const response = await fetch(geminiUrlFor(models[i]), {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: aiConversation.map(({ role, parts }) => ({ role, parts })), // strip local-only fields like _toolResult
                            systemInstruction: { parts: [{ text: AI_SYSTEM_PROMPT }] },
                            tools: [{ functionDeclarations: AI_FUNCTION_DECLARATIONS }]
                        })
                    });
                    if (response.ok) return response.json();
                    const isRateLimit = response.status === 429, hasFallback = i < models.length - 1; if (isRateLimit &&
                        hasFallback) continue; // try the next model down the fallback chain
                    let detail = "";
                    try { detail = (await response.json())?.error?.message || ""; } catch {}
                    throw new Error(`Gemini API request failed (${response.status}). ${detail}`);
                }
            }

            async function processUserPrompt(userInput, loadingElement, image) {
                const parts = [];
                if (image) {
                    parts.push({ inlineData: { mimeType: image.mimeType, data: image.data } });
                    parts.push({ text: userInput || "Here's a photo — take a look and tell me what you think it is." });
                } else {
                    parts.push({ text: userInput });
                }
                aiConversation.push({ role: "user", parts });

                for (let step = 0; step < 25; step++) {
                    const data = await callGemini();
                    const candidate = data.candidates?.[0];
                    if (!candidate || !candidate.content) {
                        loadingElement.textContent = "Sorry, I didn't get a usable response from the AI.";
                        return;
                    }
                    const resultParts = candidate.content.parts || [];
                    const functionCalls = resultParts.filter(p => p.functionCall).map(p => p.functionCall);
                    const textReply = resultParts.filter(p => p.text).map(p => p.text).join("\n").trim();

                    aiConversation.push({ role: "model", parts: resultParts });

                    if (functionCalls.length) {
                        const responseParts = functionCalls.map(fc => ({
                            functionResponse: { name: fc.name, response: { result: executeAiTool(fc.name, fc.args) } }
                        }));
                        // NOTE: this API rejects role "function" (confirmed via a live 400 error listing valid
                        // roles as USER/MODEL/etc, no FUNCTION) — tool results go back in as role "user" instead,
                        // same as the real Gemini API convention for function responses in this endpoint version.
                        aiConversation.push({ role: "user", parts: responseParts, _toolResult: true });
                        continue; // let the model see the tool results and respond
                    }

                    loadingElement.textContent = textReply.replace(/\s*\[CONFIRM\]\s*$/, '').trim() || "Done."; if (
                        /\[CONFIRM\]\s*$/.test(textReply)) addConfirmButtons(loadingElement);
                    return;
                }

                loadingElement.textContent = "That request needed more steps than I could safely take at once — try breaking it into smaller asks.";
            }
