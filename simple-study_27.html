            const blankState = () => ({
                settings: { firstName: '', lastName: '', dob: '', yearGroup: '', termStart: '', termEnd: '',
                    theme: 'light', onboarded: false, sidebarMode: 'hover',
                    studyPreferences: { intensity: '', pointsTarget: '', timeOfDay: '', weekendBalance: '', notes: '' } },
                subjects: [],
                events: [],
                tasks: [],
                holidays: [],
                exams: [],
                topics: [],
                reminders: [],
                classTopics: [], // what's currently/previously been covered in each class — see section on the Classes page
                studyPlans: {},
                lastRampSync: '',
                lastSelfStudyCheck: 0, // timestamp (ms) — drives the roughly-hourly auto-check on Dashboard load
                week: weekStart(localDate())
            });
            let state = load();
            invalidateFutureStudyPlans(); // regenerate any not-yet-logged study plans fresh on every load, so
            // changes to class topics/tasks/exams (or to the planning logic itself) are always reflected rather
            // than trusting a stale cached plan from an earlier session — see IMPLEMENTATION_NOTES.
            let view = 'dashboard';
            let modal = null;
            let selected = null;
            let toastTimer;
            const PX_PER_MIN = 0.6; // pixels per minute for the always-full-day, naturally-scrollable timetable
            let timetableScrollTop = { dashboard: null, timetable: null }; // remembered scroll position per view
            let studyViewDate = localDate(); // which day the Study page is showing
            let activeLogItem = null; // { itemId } of the check-in form currently open on the Study page
            let editingTopicId = null; // which class topic (if any) is being inline-edited on the subject detail modal
            let onboardingStep = 1; // which step of the welcome wizard is showing
            let examWizard = null; // { step, editingId, kind, name, start, end, examSubjects, subjectIndex, sittings, photo }
            let examScheduleWeek = null; // Monday string currently shown in the exam-schedule popup
            let examResultDraft = null; // { markingType, percentUnknown } — just enough to know which fields to show
            const YEAR_GROUPS = ['1st', '2nd', '3rd', '4th', '5th', '6th'];

            function load() {
                try {
                    const saved = JSON.parse(localStorage.getItem(STORE));
                    if (!saved || !saved.settings) return blankState();
                    const subjects = (Array.isArray(saved.subjects) ? saved.subjects : []).map(s => { const patch = {};
                        if (!s.category) patch.category = guessSubjectCategory(s.name); if (!s.taxonomyId) patch
                            .taxonomyId = guessSubjectTaxonomyId(s.name); return Object.keys(patch).length ? {
                            ...s, ...patch } : s; });
                    const events = (Array.isArray(saved.events) ? saved.events : []).map(e => { if (e.type !==
                            'study' || (e.studyKind === 'self' || e.studyKind === 'supervised')) return e;
                        return { ...e, studyKind: e.skippable === false ? 'supervised' : 'self' }; });
                    return { ...blankState(), ...saved, settings: { ...blankState().settings, ...saved.settings },
                        subjects, events, exams: Array.isArray(saved.exams) ? saved.exams : [],
                        topics: Array.isArray(saved.topics) ? saved.topics : [], reminders: Array.isArray(saved
                            .reminders) ? saved.reminders : [], classTopics: Array.isArray(saved.classTopics) ?
                            saved.classTopics : [], studyPlans: saved.studyPlans && typeof saved.studyPlans ===
                            'object' ? saved.studyPlans : {} };
                } catch { return blankState(); }
            }

            function save() { localStorage.setItem(STORE, JSON.stringify(state)); }

            function toast(message) { const el = document.getElementById('toast');
                el.textContent = message;
                el.classList.add('show');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => el.classList.remove('show'), 2600); }

            function subject(id) { return state.subjects.find(s => s.id === id); }

            function event(id) { return state.events.find(e => e.id === id); }

            // A "class" event's name IS its subject: look up a subject with a matching name (case-insensitive),
            // or create one on the fly. This keeps subjects and class names from drifting apart, since there is
            // no separate subject-management screen any more.
            function findOrCreateSubjectByClassName(name, color) { const norm = (name || '').trim(); if (!norm)
                    return '';
                let s = state.subjects.find(x => x.name.toLowerCase() === norm.toLowerCase()); if (!s) { s = {
                        id: uid(), name: norm, color: color || pickDistinctColor(state.subjects.map(x => x.color)),
                        target: 60, lastReview: '', active: true, examSubject: true, category: guessSubjectCategory(
                            norm), taxonomyId: guessSubjectTaxonomyId(norm) };
                    state.subjects.push(s); } else { s.name = norm; if (color) s.color = color; }
                return s.id; }

            function usedColors(excludeId) { return new Set(state.events.filter(e => e.id !== excludeId && e.type !==
                    'study').map(e => e.color)); }

            function isHoliday(date) { return state.holidays.find(h => date >= h.start && date <= h.end); }

            function dayStatus(date) { const h = isHoliday(date); if (h) return h.kind;
                const d = mondayIndex(date); return d >= 5 ? 'weekend' : 'normal'; }

            function visibleOn(eventObj, sourceDate) {
                const status = dayStatus(sourceDate);
                if (eventObj.type === 'sleep' || eventObj.type === 'meal') return true;
                if (status === 'holiday') return false;
                if ((status === 'dayoff' || status === 'weekend') && (eventObj.type === 'class' || eventObj.inSchool))
                    return false;
                return true;
            }

            // Real exams (Mocks, LC, etc.) can sit after the timetabled term ends. Everything else stops dead at
            // term end, but study blocks keep recurring right up to the last such exam so revision doesn't just stop.
            function latestExamDateAfter(afterDate) { let latest = null;
                (state.exams || []).forEach(exam => { (exam.sittings || []).forEach(s => { if (s.date && s.date >
                            afterDate && (!latest || s.date > latest)) latest = s.date; }); if (exam.end && exam
                        .end > afterDate && (!latest || exam.end > latest)) latest = exam.end; });
                return latest; }

            // Finds the next date+event a subject's class actually occurs on, from (and including) fromDate.
            // Used to target a reminder at one specific class occurrence rather than every recurrence of it.
            function nextClassOccurrence(subjectId, fromDate) { const classEvent = state.events.find(e => e.type ===
                    'class' && e.subjectId === subjectId); if (!classEvent) return null; for (let i = 0; i <= 120; i++) {
                    const d = addDays(fromDate, i); if (classEvent.slots.some(slot => sourceMatches(classEvent, d,
                            slot))) return { eventId: classEvent.id, date: d }; }
                return { eventId: classEvent.id, date: fromDate }; }

            // Shared by the UI checkbox and the AI's toggle_task_done tool, so both get the same
            // "bring this in" reminder side-effect when homework/a project gets marked done.
            function setTaskDone(t, done) { t.done = done; if (t.done && t.subjectId && t.type !== 'test' &&
                    !state.reminders.some(r => r.taskId === t.id)) { const next = nextClassOccurrence(t.subjectId,
                        localDate()); if (next) state.reminders.push({ id: uid(), eventId: next.eventId,
                        targetDate: next.date, subjectId: t.subjectId, text: `Bring in: ${t.title}`,
                        importance: false, createdDate: localDate(), taskId: t.id, dismissed: false }); } }

            function withinSchoolWindow(eventObj, date) {
                if (eventObj.examPeriodId) { const ex = state.exams.find(x => x.id === eventObj.examPeriodId);
                    return ex ? (date >= ex.start && date <= ex.end) : false; }
                const { termStart, termEnd } = state.settings; if (!termStart || !termEnd) return true; // no school year set yet — don't restrict anything
                if (date < termStart) return false;
                if (date <= termEnd) return true;
                if (eventObj.type !== 'study') return false; // classes/activities/sleep/meals stop dead at term end
                const examTail = latestExamDateAfter(termEnd); return examTail ? date <= examTail : false;
            }

            function sourceMatches(eventObj, sourceDate, slot) {
                if ((eventObj.skipDates || []).includes(sourceDate)) return false;
                if (eventObj.date) return eventObj.date === sourceDate; // one-off events aren't gated by term dates
                return (slot.days || []).includes(mondayIndex(sourceDate)) && withinSchoolWindow(eventObj, sourceDate);
            }

            function segmentsForDate(date, includeHidden = false) {
                const answer = [];
                const previous = addDays(date, -1);
                state.events.forEach(e => { if (e.examPeriodId) return; e.slots.forEach(slot => {
                    const start = mins(slot.start),
                        end = mins(slot.end),
                        overnight = end <= start;
                    if (sourceMatches(e, date, slot) && (includeHidden || visibleOn(e, date)))
                        answer.push({ event: e, slot, start, end: overnight ? 1440 : end, sourceDate: date,
                            segment: 'start' });
                    if (overnight && sourceMatches(e, previous, slot) && (includeHidden || visibleOn(e,
                        previous))) answer.push({ event: e, slot, start: 0, end, sourceDate: previous,
                        segment: 'end' });
                }); });
                return answer.sort((a, b) => a.start - b.start || a.end - b.end);
            }

            // The Timetable page is a static "what does a normal week look like" editor, not a calendar — it shows
            // every recurring weekly slot regardless of holidays, term dates, or one-off skips. Only weekly-recurring
            // (non-dated, non-exam-scoped) events appear here; one-off dated events and exam-scoped events don't.
            function templateSegmentsForDate(date) { const dow = mondayIndex(date), prevDow = (dow + 6) % 7,
                    answer = []; state.events.forEach(e => { if (e.date || e.examPeriodId) return; e.slots.forEach(
                        slot => { if (!slot.days || !slot.days.length) return; const start = mins(slot.start),
                            end = mins(slot.end), overnight = end <= start; if (slot.days.includes(dow)) answer.push({
                                event: e, slot, start, end: overnight ? 1440 : end, sourceDate: date,
                                segment: 'start' }); if (overnight && slot.days.includes(prevDow)) answer.push({
                                event: e, slot, start: 0, end, sourceDate: addDays(date, -1), segment: 'end' }); }); });
                return answer.sort((a, b) => a.start - b.start || a.end - b.end); }

            function busyForDate(date) {
                const intervals = segmentsForDate(date).map(x => [x.start, x.end]).sort((a, b) => a[0] - b[0]);
                const merged = [];
                intervals.forEach(([a, b]) => { const last = merged[merged.length - 1]; if (last && a <= last[1])
                        last[1] = Math.max(last[1], b);
                    else merged.push([a, b]); });
                return merged;
            }

            function awakeWindow(date) {
                const segs = segmentsForDate(date, true).filter(x => x.event.type === 'sleep');
                let wake = 420,
                    bed = 1380; // sensible fallback: 07:00–23:00, used only if no sleep block is set for this day
                const morning = segs.find(x => x.start === 0); if (morning) wake = morning.end;
                const evening = segs.filter(x => x.end === 1440).sort((a, b) => a.start - b.start)[0]; if (evening)
                    bed = evening.start; if (bed <= wake) { wake = 420;
                    bed = 1380; } return [wake, bed];
            }

            function freeIntervals(date, until = 1440) {
                const [ws, weRaw] = awakeWindow(date);
                const we = Math.min(weRaw, until);
                if (we <= ws) return [];
                const used = busyForDate(date);
                let p = ws;
                const out = [];
                used.forEach(([a, b]) => { a = Math.max(a, ws);
                    b = Math.min(b, we); if (b <= ws || a >= we) return; if (a > p) out.push([p, a]);
                    p = Math.max(p, b); }); if (p < we) out.push([p, we]);
                return out;
            }

            function availableTo(date, endMinute = 1440) {
                const today = localDate();
                if (date < today) return 0;
                let n = 0;
                for (let d = today; d <= date; d = addDays(d, 1)) n += freeIntervals(d, d === date ? endMinute : 1440)
                    .reduce((a, [s, e]) => a + e - s, 0);
                return n;
            }

            function dueMinute(task) {
                if (task.online) return 1439;
                const day = mondayIndex(task.due);
                const classes = state.events.filter(e => e.type === 'class' && e.subjectId === task.subjectId);
                const starts = classes.flatMap(e => e.slots.filter(s => sourceMatches(e, task.due, s)).map(s => mins(s
                    .start)));
                return starts.length ? Math.min(...starts) : 1439;
            }

            function tasksByDeadline() { return state.tasks.filter(t => !t.done && t.type !== 'test').sort((a, b) => a.due
                    .localeCompare(b.due) || dueMinute(a) - dueMinute(b)); }

            function cushions() { let committed = 0; return tasksByDeadline().map(t => { committed += Number(t
                        .minutes || 0); return [t.id, availableTo(t.due, dueMinute(t)) - committed]; }).reduce((a,
                    [id, v]) => (a[id] = v, a), {}); }

            function globalCushion() { const map = cushions(),
                    values = Object.values(map); if (!values.length) return { kind: 'good', label: 'Clear',
                        detail: 'No study-time estimates due.' };
                const min = Math.min(...values); if (min < 0) return { kind: 'bad', label: 'Overbooked',
                    detail: `${fmtMins(-min)} short before a deadline` }; if (min < 120) return { kind: 'tight',
                    label: 'Tight', detail: `Only ${fmtMins(min)} at the tightest point` }; return { kind: 'good',
                    label: 'On track', detail: `${fmtMins(min)} minimum cushion` }; }

            function plannedMinutes(subjectId, week) { return range(week, 7).reduce((total, date) => total +
                    segmentsForDate(date).filter(x => x.event.type === 'study' && (!subjectId || x.event
                        .subjectId === subjectId)).reduce((a, x) => a + x.end - x.start, 0), 0); }

            function ageInDays(date) { return date ? Math.max(0, Math.round((dateFrom(localDate()) - dateFrom(date)) /
                    86400000)) : 7; }

            function recommendation() {
                const cs = cushions();
                const urgent = tasksByDeadline().sort((a, b) => (cs[a.id] ?? 0) - (cs[b.id] ?? 0) || a.due.localeCompare(
                    b.due))[0];
                if (urgent) { const s = subject(urgent.subjectId); return { kind: 'task', subject: s, name: urgent.title,
                        duration: Math.min(DEFAULT_SESSION_MIN, Number(urgent.minutes || DEFAULT_SESSION_MIN)),
                        description: `Make concrete progress before ${fmtDate(urgent.due)}. Its current cushion is ${fmtMins(Math.max(0,cs[urgent.id]||0))}.`,
                        method: s ? studyMethodFor(s) : 'Break it into a small, finishable next action.' }; }
                const scores = state.subjects.filter(s => s.active).map(s => ({ s, gap: Math.max(0, s.target -
                        plannedMinutes(s.id, state.week)), age: ageInDays(s.lastReview) })).sort((a, b) => (b.gap +
                        b.age * 12) - (a.gap + a.age * 12));
                const pick = scores[0]?.s || state.subjects[0];
                return { kind: 'review', subject: pick, name: pick?.name || 'Start a subject',
                    duration: DEFAULT_SESSION_MIN, description: pick ?
                        `${fmtMins(Math.max(0,pick.target-plannedMinutes(pick.id,state.week)))} still unplanned this week.` :
                        'Set up your subjects to receive a tailored recommendation.',
                    method: pick ? studyMethodFor(pick) : '' };
            }

            function findSlot(minutesNeeded) { const length = Math.max(15, Number(minutesNeeded ||
                    DEFAULT_SESSION_MIN)); for (let offset = 0; offset < 21; offset++) { const date = addDays(localDate(),
                        offset);
                    const slot = freeIntervals(date).find(([a, b]) => b - a >= length); if (slot) return { date,
                        start: slot[0], end: slot[0] + length }; } return null; }

            function fmtHM(m) { return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`; }

            // Returns up to `count` distinct free slots (one per day) of at least `minutesNeeded`,
            // searching the next 21 days, optionally skipping a given date (e.g. the day you're
            // asking to move a session away from). Used for AI-suggested replacement study times.
            function findFreeSlots(minutesNeeded, count = 3, excludeDate = '') {
                const length = Math.max(15, Number(minutesNeeded || DEFAULT_SESSION_MIN));
                const found = [];
                for (let offset = 0; offset < 21 && found.length < count; offset++) {
                    const date = addDays(localDate(), offset);
                    if (date === excludeDate) continue;
                    const slot = freeIntervals(date).find(([a, b]) => b - a >= length);
                    if (slot) found.push({ date, start: slot[0], end: slot[0] + length });
                }
                return found;
            }

            function weeksUntil(fromDate, toDate) { return Math.round((dateFrom(toDate) - dateFrom(fromDate)) /
                (7 * 86400000)); }

            // Returns how strongly a subject's study time should be prioritised right now because of an
            // approaching exam — following the same ramp-up shape described in the user's study plan:
            // gradual increase starting ~5 weeks out for ordinary exams and ~9 weeks out for Mocks/the
            // Leaving Cert, peaking the week before, then tapering to light review in exam week itself.
            // This feeds the Study page's content generator rather than creating separate timetable events —
            // extra study now means "more of this subject inside your existing supervised study blocks",
            // not a new block. This is a simplified, defensible reading of qualitative guidance, not a
            // formula taken verbatim from the document.
            function examUrgencyForSubject(subjectId, date) {
                let best = null;
                (state.exams || []).forEach(exam => {
                    const sitting = (exam.sittings || []).find(s => s.subjectId === subjectId); if (!sitting ||
                        !sitting.date || sitting.date < date) return;
                    const rampWeeks = rampWeeksFor(exam.kind),
                        weeksOut = weeksUntil(date, sitting.date); if (weeksOut > rampWeeks) return;
                    const score = weeksOut <= 0 ? rampWeeks * 0.6 : Math.max(0, rampWeeks - weeksOut); if (!best ||
                        score > best.score) best = { score, exam, sitting, weeksOut };
                });
                return best;
            }

            // Official CAO Common Points Scale (source: cao.ie) — unchanged since 2017, same for every year.
            const CAO_POINTS = { H1: 100, H2: 88, H3: 77, H4: 66, H5: 56, H6: 46, H7: 37, H8: 0,
                O1: 56, O2: 46, O3: 37, O4: 28, O5: 20, O6: 12, O7: 0, O8: 0 };
            // Computes CAO points for a real Leaving Cert or Mock exam once results are in: best six subjects
            // count, plus 25 bonus points for Higher Level Mathematics specifically (not Applied Maths) at grade
            // H6 or above. Returns null if this isn't an LC/mock exam. While any sitting is missing a result,
            // returns { pending: true } so the UI can show "waiting for results" instead of a wrong total.
            function examCaoResults(examId) { const ex = state.exams.find(x => x.id === examId); if (!ex || [
                        'lc', 'mock'].indexOf(ex.kind) === -1) return null;
                const sittings = ex.sittings || []; if (!sittings.length) return null;
                const pending = sittings.some(s => !s.result);
                const breakdown = sittings.map(s => { const subj = subject(s.subjectId),
                        r = s.result; let points = null, gradeLabel = '', isMathsBonus = false; if (r && r
                        .markingType === 'lc') { gradeLabel = `${r.level}${r.band}`;
                        points = CAO_POINTS[gradeLabel] !== undefined ? CAO_POINTS[gradeLabel] : 0; if (subj && subj
                            .taxonomyId === 'maths' && r.level === 'H' && r.band <= 6) { points += 25;
                            isMathsBonus = true; } }
                    return { subjectId: s.subjectId, subjectName: subj ? subj.name : '', result: r, gradeLabel,
                        points, isMathsBonus }; });
                if (pending) return { pending: true, breakdown, doneCount: breakdown.filter(b => b.result).length,
                    totalCount: breakdown.length };
                const eligible = breakdown.filter(b => b.points !== null).sort((a, b) => b.points - a.points),
                    top6 = eligible.slice(0, 6), top6Ids = new Set(top6.map(b => b.subjectId)),
                    total = top6.reduce((sum, b) => sum + b.points, 0);
                return { pending: false, total, breakdown, top6Ids }; }

            // Simple, deliberately loose additive signal: did the subject's most recent recorded exam result (in
            // the last ~6 months) look weak? Feeds a small, easily-tunable/removable boost into study-plan scoring
            // — not meant to be a precise model, just a nudge toward subjects that clearly need more attention.
            function resultLooksWeak(r) { if (!r) return false; if (r.percent != null) return r.percent < 50; if (
                    r.markingType === 'lc') return r.band >= 6; if (r.markingType === 'jc') return ['achieved',
                    'partiallyAchieved', 'notGraded'].includes(r.jcGrade); if (r.markingType === 'letter') return [
                    'D', 'E', 'F'].includes(r.letter);
                return false; }

            function subjectNeedsWork(subjectId, date) { return (state.exams || []).some(ex => { if (!ex.end || (
                        dateFrom(date) - dateFrom(ex.end)) / 86400000 > 180) return false; const sitting = (ex
                    .sittings || []).find(s => s.subjectId === subjectId && s.result); return sitting &&
                    resultLooksWeak(sitting.result); }); }

            // ----------------------------------------------------------------------------------
            // Self-study gap-analysis engine — deliberately fully deterministic (no API calls), so it can run
            // on demand or on a timer without cost, latency, or reliability concerns. Answers two questions
            // the content engine above doesn't: how much total self-study should exist this week, and which
            // subjects should get more or less of it — as opposed to what to study inside a block that
            // already exists.
            //
            // Research grounding:
            // - Deliberate practice / diminishing returns (Ericsson et al.; summarised across multiple
            //   replications): benefit drops sharply past ~2 focused hours/day and there is little to no
            //   further benefit — sometimes a negative one, from fatigue/burnout — past ~4. This sets a hard
            //   ceiling on the computed weekly target, not just a soft suggestion.
            // - Rau & Durand (2000): real GPA benefit from study time only showed up past a ~14h/week
            //   threshold in their sample, and did not scale linearly beyond it — supporting a target that's
            //   capped and threshold-based rather than a naive "study X% more" multiplier.
            // - Locke & Latham's goal-setting theory: a specific, quantified gap between a target and actual
            //   performance is what should drive effort (their "cybernetic feedback loop" model) — but an
            //   unbounded response over- or under-corrects, since goals set too far beyond reach become
            //   demotivating rather than motivating. The CAO trajectory adjustment below is deliberately
            //   dampened and capped for this reason, not a simple "behind by X, so add X" rule.
            // - Retrieval practice / desirable difficulties (Bjork; Roediger & Karpicke): demonstrated
            //   struggle (a weak recent result, a dense cluster of 'bad'-rated topics) should pull a
            //   disproportionate share of time, not just an even split.

            // Parses a study-preferences points-target range ("500–599", "Under 300", "600+") to a plain
            // number to compare against a real computed CAO total.
            function pointsTargetMidpoint(rangeStr) { if (!rangeStr) return null; if (/^under/i.test(rangeStr))
                    return 250; if (/^600/.test(rangeStr)) return 620; const m = rangeStr.match(/(\d+)\D+(\d+)/);
                return m ? (Number(m[1]) + Number(m[2])) / 2 : null; }

            // The most recent COMPLETE (non-pending) CAO total from any real LC or mock exam, used as the
            // "actual" side of the goal-performance gap. Returns null if no complete result exists yet — the
            // trajectory adjustment simply doesn't apply until there's real data to compare against, rather
            // than guessing.
            function mostRecentCaoTrajectory() { const rows = state.exams.filter(ex => ['lc', 'mock'].includes(ex
                    .kind)).map(ex => ({ ex, r: examCaoResults(ex.id) })).filter(x => x.r && !x.r.pending).sort((a,
                    b) => (b.ex.end || '').localeCompare(a.ex.end || ''));
                return rows.length ? rows[0].r.total : null; }

            // The single most recent recorded result for one subject specifically, across any exam/test kind,
            // used for the CAO point-headroom factor below.
            function mostRecentSubjectResult(subjectId) { const rows = []; (state.exams || []).forEach(ex => { (
                        ex.sittings || []).forEach(s => { if (s.subjectId === subjectId && s.result) rows.push({
                            ...s.result, examEnd: ex.end || '' }); }); });
                rows.sort((a, b) => (b.examEnd || '').localeCompare(a.examEnd || ''));
                return rows[0] || null; }

            // Part 1: total weekly self-study MINUTES the user should be aiming for — separate from which
            // subjects get it (Part 2) or when it happens (placement below).
            function computeWeeklySelfStudyTarget() { const sp = state.settings.studyPreferences || {};
                const baseByIntensity = { light: 240, moderate: 480, intense: 750 },
                    usedDefaultIntensity = !sp.intensity; let base = baseByIntensity[sp.intensity] || 480,
                    adjustmentFactor = 0, trajectoryNote = null; if (['5th', '6th'].includes(state.settings
                        .yearGroup) && sp.pointsTarget) { const targetMid = pointsTargetMidpoint(sp.pointsTarget),
                        current = mostRecentCaoTrajectory(); if (targetMid != null && current != null) { const gap =
                            targetMid - current; // asymmetric on purpose: falling short can push the target up
                            // more than exceeding it pulls the target down, since under-preparing for a real
                            // exam is a worse failure mode than a slightly lighter week once already ahead.
                            adjustmentFactor = Math.max(-0.2, Math.min(0.4, gap / 500));
                        trajectoryNote = { gap, current, targetMid }; } }
                let target = base * (1 + adjustmentFactor); // Ericsson-grounded ceiling/floor — see header comment
                target = Math.max(120, Math.min(900, Math.round(target / 15) * 15));
                return { targetMinutes: target, usedDefaultIntensity, adjustmentFactor, trajectoryNote }; }

            function plannedSelfStudyMinutes(week) { return range(week, 7).reduce((total, date) => total +
                    segmentsForDate(date).filter(x => x.event.type === 'study' && x.event.studyKind !==
                        'supervised').reduce((a, x) => a + x.end - x.start, 0), 0); }

            // Part 2: how the weekly self-study target should be SHARED across subjects — a weighted
            // multi-factor need score per subject, normalised so shares sum to 1.
            function computeSubjectNeedShares(date) { const subjects = examSubjectsList(); if (!subjects.length)
                    return []; const week = weekStart(date);
                const rows = subjects.map(s => { const examInfo = examUrgencyForSubject(s.id, date),
                        examScore = examInfo ? examInfo.score : 0,
                        weakResult = subjectNeedsWork(s.id, date) ? 1 : 0,
                        topics = state.classTopics.filter(t => t.subjectId === s.id && t.status !== 'paused'),
                        struggling = topics.filter(t => t.status === 'done' && (t.rating === 'bad' ||
                            isClassTopicDue(t, date, 0))).length,
                        struggleDensity = topics.length ? struggling / topics.length : 0,
                        shortfall = Math.max(0, (s.target || 0) - plannedMinutes(s.id, week)) / 60;
                    let headroom = 0; const recent = mostRecentSubjectResult(s.id); if (recent && recent
                        .markingType === 'lc') headroom = Math.max(0, recent.band - 1) / 7; // 0 (H1, little room left) to 1 (H8, lots of room)
                    const need = examScore * 1.4 + weakResult * 2 + struggleDensity * 2.5 + shortfall * 0.6 +
                        headroom * 1.2;
                    return { subjectId: s.id, subject: s, need, examScore, weakResult, struggleDensity, shortfall,
                        headroom }; });
                const totalNeed = rows.reduce((a, r) => a + r.need, 0); if (totalNeed <= 0) return rows.map(r => ({
                        ...r, share: 1 / rows.length }));
                return rows.map(r => ({ ...r, share: r.need / totalNeed })); }

            // Finds a free slot, preferring ones that match the user's stated time-of-day / weekday-weekend
            // preferences rather than just the chronologically first opening — a soft preference, not a hard
            // filter, so a slot is still found even if no preferred-time opening exists.
            function findPreferredSlot(minutesNeeded, excludeDates) { const sp = state.settings.studyPreferences ||
                    {}, length = Math.max(15, Number(minutesNeeded || DEFAULT_SESSION_MIN)); const candidates = [];
                for (let offset = 0; offset < 14; offset++) { const date = addDays(localDate(), offset); if ((
                        excludeDates || []).includes(date)) continue; const day = mondayIndex(date),
                        isWeekend = day >= 5;
                    freeIntervals(date).forEach(([a, b]) => { if (b - a < length) return; let score = 0; if (sp
                            .weekendBalance === 'weekday' && !isWeekend) score += 2; if (sp.weekendBalance ===
                            'weekend' && isWeekend) score += 2; if (sp.timeOfDay === 'morning' && a < 720) score +=
                            2; if (sp.timeOfDay === 'afternoon' && a >= 720 && a < 1020) score += 2; if (sp
                            .timeOfDay === 'evening' && a >= 1020) score += 2;
                        score -= offset * 0.1; // mild preference for sooner over later, all else equal
                        candidates.push({ date, start: a, end: a + length, score }); }); }
                candidates.sort((a, b) => b.score - a.score);
                return candidates[0] || null; }

            // Part 3: placement. Ties the target (Part 1) and the per-subject shares (Part 2) together into
            // actual timetable changes — always self-study only, never supervised, and only ever adjusting
            // blocks this function itself created (`autoGenerated: true`) rather than anything the user placed
            // by hand, which is left alone even if the total looks off. Returns a summary object for on-screen
            // feedback — goal-setting theory (Locke & Latham) treats feedback as load-bearing, not optional,
            // for a target-driven system to actually work.
            function runSelfStudyAutoPlan() { const today = localDate(), week = weekStart(today);
                const { targetMinutes, usedDefaultIntensity, adjustmentFactor, trajectoryNote } =
                    computeWeeklySelfStudyTarget(),
                    currentMinutes = plannedSelfStudyMinutes(week),
                    gap = targetMinutes - currentMinutes, THRESHOLD = 30;
                const summary = { targetMinutes, currentMinutes, gap, usedDefaultIntensity, adjustmentFactor,
                    trajectoryNote, added: [], removed: [], note: '' };
                if (Math.abs(gap) < THRESHOLD) { summary.note =
                        "This week's self-study time already matches the target — no changes made.";
                    return summary; }
                if (gap > 0) { const shares = computeSubjectNeedShares(today); if (!shares.length) { summary.note =
                            'No exam subjects to plan for yet.';
                        return summary; }
                    shares.sort((a, b) => b.need - a.need); let remaining = gap; const usedDates = [];
                    shares.forEach(row => { if (remaining < 15) return; const allocated = Math.min(remaining, Math
                            .max(15, Math.round(gap * row.share / 15) * 15)); if (allocated < 15) return;
                        const weekEnd = addDays(week, 7);
                        const existingAuto = state.events.find(e => e.type === 'study' && e.studyKind === 'self' &&
                            e.autoGenerated && e.subjectId === row.subjectId && e.date && e.date >= today && e.date <
                            weekEnd); let placed = null; if (existingAuto) { const slot = existingAuto.slots[0],
                            currentLen = duration(slot.start, slot.end),
                            extendBy = Math.min(allocated, 90 - currentLen); // single-session cap — session length itself has diminishing returns past ~60-90 min
                        if (extendBy >= 15) { slot.end = fmtHM(mins(slot.start) + currentLen + extendBy);
                            placed = { subject: row.subject, minutes: extendBy, date: existingAuto.date,
                                extended: true };
                            remaining -= extendBy; } } if (!placed) { const sessionLen = Math.min(allocated, 90),
                            slot = findPreferredSlot(sessionLen, usedDates); if (slot) { state.events.push({
                                id: uid(), type: 'study', studyKind: 'self', skippable: true, autoGenerated: true,
                                name: `${row.subject.name} self study`, subjectId: row.subjectId, color: STUDY_COLOR,
                                inSchool: false, details: studyMethodFor(row.subject), date: slot.date,
                                skipDates: [], slots: [{ id: uid(), days: [], start: fmtHM(slot.start),
                                    end: fmtHM(slot.end) }] });
                            usedDates.push(slot.date);
                            placed = { subject: row.subject, minutes: sessionLen, date: slot.date,
                                extended: false };
                            remaining -= sessionLen; } } if (placed) summary.added.push(placed); });
                    summary.note = summary.added.length ? `Added ${fmtMins(summary.added.reduce((a,p)=>a+p.minutes,0))} of self-study across ${new Set(summary.added.map(p=>p.subject.id)).size} subject${new Set(summary.added.map(p=>p.subject.id)).size===1?'':'s'}.` :
                        "Couldn't find enough free time to add self-study — check whether your sleep events leave enough waking hours free."; } else { const shares =
                    computeSubjectNeedShares(today).sort((a, b) => a.need - b.need); let toRemove = -gap;
                    shares.forEach(row => { if (toRemove < 15) return; state.events.filter(e => e.type === 'study' &&
                            e.studyKind === 'self' && e.autoGenerated && e.subjectId === row.subjectId && e.date &&
                            e.date >= today && e.date < addDays(week, 7)).forEach(ev => { if (toRemove < 15) return;
                            const len = duration(ev.slots[0].start, ev.slots[0].end);
                            state.events = state.events.filter(x => x.id !== ev.id);
                            toRemove -= len;
                            summary.removed.push({ subject: row.subject, minutes: len, date: ev.date }); }); });
                    summary.note = summary.removed.length ? `Trimmed ${fmtMins(summary.removed.reduce((a,p)=>a+p.minutes,0))} of self-study that this planner had previously added, freeing up some time.` :
                        "You have more self-study scheduled than the target, but it looks like you placed it yourself, so it's left alone."; }
                invalidateFutureStudyPlans();
                save();
                render();
                return summary; }

            function selfStudyPlanSummaryModal(summary) { const trajectoryLine = summary.trajectoryNote ?
                    `<p class="small">CAO trajectory: ${summary.trajectoryNote.current} pts so far vs a ${Math.round(summary.trajectoryNote.targetMid)} pt target (${summary.trajectoryNote.gap>=0?Math.round(summary.trajectoryNote.gap)+' short':Math.round(-summary.trajectoryNote.gap)+' ahead'}).</p>` :
                    '';
                const row = (p) => `<div class="topic-row"><span>${escape(p.subject.name)}</span><span class="small">${p.minutes>=0?'+':''}${fmtMins(Math.abs(p.minutes))}${p.extended?' (extended)':''} · ${fmtDate(p.date)}</span></div>`,
                    addedList = summary.added.length ? `<div style="margin-top:14px"><h3>Added</h3><div class="list">${summary.added.map(row).join('')}</div></div>` :
                    '',
                    removedList = summary.removed.length ? `<div style="margin-top:14px"><h3>Trimmed</h3><div class="list">${summary.removed.map(p=>row({...p,minutes:-p.minutes})).join('')}</div></div>` :
                    '';
                return modalShell('Self-study plan updated',
                    `<div class="event-detail"><div style="text-align:center;padding:20px;background:var(--surface-2);border-radius:14px;margin-bottom:14px"><div class="small">This week's self study</div><h2 style="margin-top:6px">${fmtMins(summary.currentMinutes)} → target ${fmtMins(summary.targetMinutes)}</h2></div>${trajectoryLine}<p class="small">${escape(summary.note)}</p>${addedList}${removedList}${summary.usedDefaultIntensity?'<p class="small" style="margin-top:10px">Using a default estimate since study preferences haven\'t been set yet.</p>':''}</div>`,
                    `<button class="button primary" data-action="close-modal">Got it</button>`,
                    true); }

            function studyKindLabel(e) {
                if (e.type !== 'study') return TYPE_INFO[e.type].label;
                return e.studyKind === 'supervised' ? 'Supervised study' : 'Self study';
            }

            function autoPlan() { const r = recommendation(),
                    slot = findSlot(r.duration); if (!slot) { toast(
                        'No free time was found in the next few weeks. Check your sleep events leave enough waking time.'); return; }
                const e = { id: uid(), type: 'study', studyKind: 'self', skippable: true, skipDates: [], name: r.kind === 'task' ? `Work: ${r.name}` :
                        `${r.name} retrieval practice`, subjectId: r.subject?.id || '', color: STUDY_COLOR,
                    inSchool: false, details: r.method, date: slot.date, slots: [{ id: uid(), days: [],
                        start: fmtHM(slot.start), end: fmtHM(slot.end)
                    }] };
                state.events.push(e); if (r.subject) r.subject.lastReview = slot.date;
                save();
                render();
                toast(`Study session scheduled for ${fmtDate(slot.date)} at ${time(slot.start)}.`); }

            // ----------------------------------------------------------------------------------
            // Study page engine: automatically fills each day's supervised study blocks (existing
            // "study"-type timetable events) with what to actually study, drawing on three inputs —
            // tasks due soon, spaced-repetition topics due for review, and each subject's weekly
            // balance (boosted as a real exam approaches). Nothing here invents new timetable events;
            // it only plans the content of blocks the user has already scheduled.
            // ----------------------------------------------------------------------------------

            function invalidateFutureStudyPlans() {
                const today = localDate();
                Object.keys(state.studyPlans || {}).forEach(date => { if (date < today) return;
                    const plan = state.studyPlans[date]; if (!plan || !plan.blocks) return;
                    plan.blocks.forEach(b => { b.items = (b.items || []).filter(i => i.logged); }); });
            }

            // ----------------------------------------------------------------------------------
            // Study scheduling engine — rebuilt from scratch (the original version dated to the very start
            // of the app, before class topics, exam results, or per-topic tracking existed). Grounded in
            // three well-established findings from learning-science research rather than ad hoc scoring:
            //
            // 1. SPACED REPETITION (Ebbinghaus 1885; Cepeda et al. 2006, a meta-analysis of 254 studies /
            //    14,000+ participants): distributing review over time beats massing it, and reviews should
            //    happen at *expanding* intervals — well-known material needs rare review, shaky material
            //    needs frequent review. classTopicReviewInterval()/isClassTopicDue() implement this using
            //    the traffic-light rating as a stand-in for recall strength, replacing the old flat
            //    "studied within 2 days = skip" rule with real interval-based scheduling per topic.
            // 2. EXAM-PROXIMITY TIGHTENING (Cepeda et al. 2008): the ideal gap between review sessions
            //    shrinks as a test gets closer. examUrgencyForSubject's score is used both to boost a
            //    candidate's priority AND to directly shrink its review interval near a real exam/test.
            // 3. INTERLEAVING (Rohrer 2012; Kornell & Bjork 2008): mixing subjects produces better transfer
            //    and retention than blocking (all of one subject, then the next) — and is the direct fix for
            //    subjects structurally never getting scheduled. The old block-filling loop only avoided
            //    repeating a subject *within* the single block being filled; a handful of high-scoring
            //    subjects (more topics, closer exams) could still dominate every block across a whole day.
            //    The new loop tracks subject usage across ALL of a day's blocks together and prefers
            //    whichever active subject has been used least so far — score still matters, but only as a
            //    tiebreaker once fairness is satisfied.
            //
            // Retrieval practice / "desirable difficulties" (Bjork 1994; Roediger & Karpicke 2006): a
            // struggling topic's priority keeps climbing the longer it goes unaddressed, rather than losing
            // priority after being suggested once, so genuinely weak areas can't quietly fall through.
            //
            // Not attempted here (documented, not silently ignored): free-text setup/post-exam notes and
            // study-preference fields (timeOfDay/weekendBalance) aren't parsed into this scoring — they're
            // qualitative and better handled by human/AI judgement (the AI already gets them via
            // read_app_state and is instructed to factor them in when it creates additional study time) than
            // by a brittle keyword-matching heuristic here. Points target / intensity likewise isn't wired
            // into block-filling, since this engine only fills blocks that already exist on the timetable —
            // it doesn't create new ones (that remains the AI/user's job, per Round 3's design).

            // Expanding-interval spacing tier from a topic's traffic-light rating. Deliberately coarse (3
            // tiers, not a numeric ease factor like SuperMemo/Anki) since our signal is a manual 3-way rating
            // rather than a per-review pass/fail — matching the resolution of data we actually have.
            function classTopicReviewInterval(ct) { if (ct.rating === 'bad') return 2; if (ct.rating === 'good')
                    return 9;
                return 5; }

            // A 'done' topic is a review candidate once enough time has passed per its interval — never
            // reviewed at all counts as immediately due. examUrgencyDays (0 if no relevant exam is close)
            // shrinks the effective interval, implementing the exam-proximity tightening described above.
            function isClassTopicDue(ct, date, examUrgencyDays) { if (!ct.lastStudied) return true;
                const daysSince = Math.round((dateFrom(date) - dateFrom(ct.lastStudied)) / 86400000),
                    interval = Math.max(1, classTopicReviewInterval(ct) - (examUrgencyDays || 0));
                return daysSince >= interval; }

            function ensureStudyPlan(date) {
                const blocks = segmentsForDate(date).filter(x => x.event.type === 'study').sort((a, b) => a.start -
                    b.start); if (!blocks.length) { delete state.studyPlans[date]; return null; }
                const existing = state.studyPlans[date];
                const sameShape = existing && existing.blocks.length === blocks.length && existing.blocks.every((b,
                    i) => b.blockEventId === blocks[i].event.id && b.blockSlotId === blocks[i].slot.id);
                const plan = { blocks: blocks.map((x, i) => { const prior = sameShape ? existing.blocks[i] : null;
                    return { blockEventId: x.event.id, blockSlotId: x.slot.id, start: x.start, end: x.end,
                        items: prior ? prior.items.slice() : [] }; }) };
                const isFull = (block) => block.items.reduce((n, i) => n + i.minutes, 0) >= (block.end - block
                    .start) - 10;
                if (plan.blocks.every(isFull)) { state.studyPlans[date] = plan; return plan; } // already fully planned — keep item ids stable across renders
                const candidateKey = (kind, subjectId, taskId, topicId, classTopicId) =>
                    `${kind}:${subjectId}:${taskId||''}:${topicId||''}:${classTopicId||''}`;
                const covered = new Set(); plan.blocks.forEach(b => b.items.forEach(i => covered.add(
                    candidateKey(i.kind, i.subjectId, i.taskId, i.topicId, i.classTopicId))));
                const candidates = [];
                state.tasks.filter(t => !t.done && t.due >= date && t.due <= addDays(date, 5)).forEach(t => {
                    if (covered.has(candidateKey('task', t.subjectId, t.id, '', ''))) return;
                    const dayGap = Math.round((dateFrom(t.due) - dateFrom(date)) / 86400000),
                        urgency = t.type === 'test' ? 6 : 4;
                    candidates.push({ subjectId: t.subjectId, label: `Prep: ${t.title}`, minutes: Math.min(
                        DEFAULT_SESSION_MIN, t.minutes || DEFAULT_SESSION_MIN), kind: 'task', taskId: t.id,
                        score: urgency + Math.max(0, 5 - dayGap) * 2 + (t.important ? 2 : 0) });
                });
                (state.topics || []).filter(top => top.nextReview && top.nextReview <= date).forEach(top => {
                    if (covered.has(candidateKey('review', top.subjectId, '', top.id, ''))) return;
                    const topSubject = subject(top.subjectId); if (topSubject && topSubject.examSubject === false)
                        return; // non-exam subjects aren't used to fill spare study time
                    const overdue = Math.round((dateFrom(date) - dateFrom(top.nextReview)) / 86400000);
                    candidates.push({ subjectId: top.subjectId, label: `Review: ${top.label}`, minutes: Math.round(
                        DEFAULT_SESSION_MIN * 0.6), kind: 'review', topicId: top.id, score: 5 + Math.min(6,
                        overdue) });
                });
                const subjectsWithClassTopics = new Set(); (state.classTopics || []).forEach(ct => { const s =
                        subject(ct.subjectId); if (!s || !s.active || s.examSubject === false || ct.status ===
                        'paused') return;
                    subjectsWithClassTopics.add(ct.subjectId); if (covered.has(candidateKey('classtopic', ct
                            .subjectId, '', '', ct.id)))
                        return; const examInfo = examUrgencyForSubject(ct.subjectId, date),
                        examBoost = examInfo ? examInfo.score : 0,
                        examUrgencyDays = examInfo ? Math.min(4, Math.round(examBoost / 3)) : 0;
                    let score, label; if (ct.status === 'learning') { score = 6;
                        label = `${ct.label} (currently learning)`; } else { if (!isClassTopicDue(ct, date,
                            examUrgencyDays)) return; // not due yet per its spaced-repetition interval
                        if (ct.rating === 'bad') { score = 8;
                            label = `Review: ${ct.label} (needs work)`; } else if (ct.rating === 'good') { score = 2;
                            label = `Quick review: ${ct.label}`; } else { score = 4.5;
                            label = `Review: ${ct.label}`; } if (ct.lastStudied) { const daysSince = Math.round((
                                dateFrom(date) - dateFrom(ct.lastStudied)) / 86400000);
                            score += Math.min(4, daysSince * 0.25); // desirable difficulty: priority keeps climbing the longer a weak/mid topic goes unaddressed
                        } else score += 3; } // marked done but never actually reviewed since — treat as urgent
                    candidates.push({ subjectId: ct.subjectId, label, minutes: DEFAULT_SESSION_MIN,
                        kind: 'classtopic', classTopicId: ct.id, score: score + examBoost * 1.2,
                        examName: examInfo?.exam?.name }); });
                state.subjects.filter(s => s.active && s.examSubject !== false && !subjectsWithClassTopics.has(s.id))
                    .forEach(s => { if (covered.has(candidateKey('balance', s.id, '', '', ''))) return;
                    const plannedSoFar = plannedMinutes(s.id, weekStart(date)),
                        shortfall = Math.max(0, (s.target || 0) - plannedSoFar),
                        age = s.lastReview ? Math.max(0, Math.round((dateFrom(date) - dateFrom(s.lastReview)) /
                            86400000)) : 7,
                        examInfo = examUrgencyForSubject(s.id, date),
                        examBoost = examInfo ? examInfo.score : 0,
                        weakResultBoost = subjectNeedsWork(s.id, date) ? 2 : 0; candidates.push({ subjectId: s.id,
                        label: `${s.name} — ${studyMethodFor(s)}`,
                        minutes: DEFAULT_SESSION_MIN, kind: 'balance', score: shortfall / 30 + age * 0.5 +
                            examBoost * 1.5 + weakResultBoost, examName: examInfo?.exam?.name }); });
                candidates.sort((a, b) => b.score - a.score);
                // Interleaving-aware fill: subjectUseCount tracks usage across ALL of today's blocks together
                // (not reset per block), so the pick below prefers whichever eligible subject has been used
                // least so far today — score is only the tiebreaker once fairness is satisfied. This is what
                // stops 2-3 high-scoring subjects (more topics tracked, or a closer exam) from structurally
                // dominating every block while other active subjects never get picked at all.
                const subjectUseCount = {}; plan.blocks.forEach(b => b.items.forEach(i => { subjectUseCount[i
                        .subjectId] = (subjectUseCount[i.subjectId] || 0) + 1; }));
                plan.blocks.filter(b => !isFull(b)).forEach(block => { const used = block.items.reduce((n, i) => n +
                        i.minutes, 0);
                    let remaining = (block.end - block.start) - used;
                    const usedInBlock = new Set(block.items.map(i => i.subjectId));
                    let guard = 0; while (remaining >= 15 && candidates.length && guard++ < 20) { let idx = -1,
                        bestUseCount = Infinity, bestScore = -Infinity;
                        candidates.forEach((c, i) => { if (usedInBlock.has(c.subjectId)) return;
                            const uc = subjectUseCount[c.subjectId] || 0; if (uc < bestUseCount || (uc ===
                                    bestUseCount && c.score > bestScore)) { idx = i;
                                bestUseCount = uc;
                                bestScore = c.score; } }); if (idx === -1) idx = 0; // every remaining candidate's subject is already in this block — just take the top-scored one
                        const c = candidates.splice(idx, 1)[0],
                            minutes = Math.min(c.minutes, remaining); block.items.push({ id: uid(),
                            subjectId: c.subjectId, label: c.label, minutes, kind: c.kind, taskId: c.taskId || '',
                            topicId: c.topicId || '', classTopicId: c.classTopicId || '', logged: false,
                            loggedLabel: '', examName: c.examName || ''
                        });
                        usedInBlock.add(c.subjectId);
                        subjectUseCount[c.subjectId] = (subjectUseCount[c.subjectId] || 0) + 1;
                        remaining -= minutes; } });
                state.studyPlans[date] = plan;
                return plan;
            }

            function recordStudyTopic(date, subjectId, label) { const norm = (label || '').trim(); if (!norm)
                    return null;
                let topic = state.topics.find(t => t.subjectId === subjectId && t.label.toLowerCase() === norm
                    .toLowerCase()); if (!topic) { topic = { id: uid(), subjectId, label: norm, lastStudied: date,
                        interval: 3, nextReview: addDays(date, 3) };
                    state.topics.push(topic); } else { const newInterval = Math.min(30, Math.max(3, Math.round((
                        topic.interval || 3) * 2)));
                    topic.interval = newInterval;
                    topic.lastStudied = date;
                    topic.nextReview = addDays(date, newInterval);
                    topic.label = norm; } return topic; }

            function logStudyItem(date, blockEventId, blockSlotId, itemId, actualLabel) { const plan = state
                .studyPlans[date]; if (!plan) return;
                const block = plan.blocks.find(b => b.blockEventId === blockEventId && b.blockSlotId ===
                    blockSlotId); if (!block) return;
                const item = block.items.find(i => i.id === itemId); if (!item) return;
                const label = (actualLabel || '').trim() || item.label.replace(/^(Prep: |Review: |Quick review: )/, '');
                item.logged = true;
                item.loggedLabel = label; if (item.classTopicId) { const ct = state.classTopics.find(c => c.id ===
                        item.classTopicId); if (ct) ct.lastStudied = date; } else recordStudyTopic(date, item
                    .subjectId, label);
                const s = subject(item.subjectId); if (s) s.lastReview = date;
                activeLogItem = null;
                save();
                render();
                toast('Logged — scheduled for review later.'); }

            function statusPill(task, cushionMap = cushions()) { if (task.done)
                    return `<span class="pill good">Done</span>`; if (task.type === 'test')
                    return `<span class="pill neutral">Test</span>`;
                const c = cushionMap[task.id] ?? 0; return c < 0 ? `<span class="pill bad">${fmtMins(-c)} short</span>` :
                    c < 120 ? `<span class="pill warn">${fmtMins(c)} cushion</span>` :
                    `<span class="pill good">${fmtMins(c)} cushion</span>`; }

            function taskIndicator(task) { const cls = task.important ? 'important' : task.type === 'test' ? 'test' :
                    'homework';
                const label = task.important ? (task.type === 'test' ? 'Important test' : task.type === 'project' ?
                    'Important project' : 'Important') : task.type === 'test' ? 'Test' : task.type === 'project' ?
                    'Project' : 'Homework'; return `<span class="task-indicator ${cls}" title="${label}" aria-hidden="true"></span>`; }

            function taskRow(task, map) { const s = subject(task.subjectId); return `<div class="task-row ${task.done?'done':''}"><button class="check ${task.done?'done':''}" aria-label="Mark ${escape(task.title)} ${task.done?'incomplete':'complete'}" data-action="toggle-task" data-id="${task.id}">${task.done?'✓':''}</button><button class="button ghost task-main" data-action="open-task" data-id="${task.id}"><span class="task-name">${taskIndicator(task)}${escape(task.title)}</span><span class="task-meta">${s?escape(s.name)+' · ':''}${fmtDate(task.due)}${task.type==='test'?' · test':''}${task.type!=='test'?' · '+fmtMins(task.minutes):''}</span></button>${statusPill(task,map)}</div>`; }

            function appFrame(content) {
                const mode = state.settings.sidebarMode || 'hover';
                const shellClass = `app-shell sidebar-mode-${mode}`;
                const sidebarClass = mode === 'collapsed' ? 'sidebar collapsed' : 'sidebar';
                return `<div class="${shellClass}"><aside class="${sidebarClass}"><div class="brand"><span class="brand-mark">✦</span><span class="brand-label">Simple Study</span></div><nav class="nav">
        ${navButton('dashboard','⌂','Dashboard')}${navButton('tasks','☑','Tasks')}${navButton('study','✎','Study')}${navButton('classes','◫','Classes')}${navButton('tests-exams','▤','Tests & Exams')}${navButton('timetable','▦','Timetable')}
      </nav><div class="sidebar-footer"><button data-action="open-settings">⚙ <span>Settings</span></button></div></aside><main>${content}</main></div>`;
            }

            function navButton(id, icon, label) { return `<button class="${view===id?'active':''}" data-action="view" data-view="${id}"><b>${icon}</b><span>${label}</span></button>`; }

            function header(title, description, tools = '') { return `<div class="page-header"><div><h1>${title}</h1><p class="muted">${description}</p></div><div class="toolbar">${tools}</div></div>`; }

            function weekControls(target) { const week = state.week,
                    end = addDays(week, 6); return `<div class="toolbar"><button class="button icon" aria-label="Previous week" data-action="change-week" data-direction="-1">‹</button><button class="button" data-action="today" data-target="${target}">Today</button><button class="button icon" aria-label="Next week" data-action="change-week" data-direction="1">›</button><span class="view-range">${fmtDate(week)} – ${fmtDate(end)}</span></div>`; }

            function calculateWeekTimeBreakdown() {
                const dates = range(state.week, 7);
                const totals = { class: 0, study: 0, activity: 0, sleep: 0 };
                const TOTAL_WEEK_MINUTES = 10080;
                dates.forEach(date => {
                    const segs = segmentsForDate(date);
                    let dailyScheduled = 0;
                    segs.forEach(seg => {
                        const dur = seg.end - seg.start;
                        dailyScheduled += dur;
                        if (seg.event.type === 'class') totals.class += dur;
                        else if (seg.event.type === 'study') totals.study += dur;
                        else if (seg.event.type === 'activity' || seg.event.type === 'meal') totals.activity +=
                            dur;
                        else if (seg.event.type === 'sleep') totals.sleep += dur;
                    });
                });
                const totalScheduled = Object.values(totals).reduce((a, b) => a + b, 0);
                const free = TOTAL_WEEK_MINUTES - totalScheduled;
                return { ...totals, free: Math.max(0, free), total: TOTAL_WEEK_MINUTES };
            }

            function drawPieChart() {
                const canvas = document.getElementById('time-pie-canvas');
                if (!canvas) return;
                const breakdown = calculateWeekTimeBreakdown();
                const categories = [
                    { label: 'Class', value: breakdown.class, color: CATEGORY_COLORS.class },
                    { label: 'Study', value: breakdown.study, color: CATEGORY_COLORS.study },
                    { label: 'Activities', value: breakdown.activity, color: CATEGORY_COLORS.activity },
                    { label: 'Sleep', value: breakdown.sleep, color: CATEGORY_COLORS.sleep },
                    { label: 'Free', value: breakdown.free, color: CATEGORY_COLORS.free }
                ];
                const ctx = canvas.getContext('2d');
                const width = canvas.width;
                const height = canvas.height;
                ctx.clearRect(0, 0, width, height);
                const total = breakdown.total;
                if (total === 0) {
                    ctx.font = '12px sans-serif';
                    ctx.fillStyle = '#aaa';
                    ctx.textAlign = 'center';
                    ctx.fillText('No data', width / 2, height / 2);
                    return;
                }
                let startAngle = -Math.PI / 2;
                categories.forEach(cat => {
                    const sliceAngle = (cat.value / total) * 2 * Math.PI;
                    if (sliceAngle > 0) {
                        ctx.beginPath();
                        ctx.moveTo(width / 2, height / 2);
                        ctx.arc(width / 2, height / 2, Math.min(width, height) / 2 - 2, startAngle, startAngle +
                            sliceAngle);
                        ctx.closePath();
                        ctx.fillStyle = cat.color;
                        ctx.fill();
                    }
                    startAngle += sliceAngle;
                });
                const legendContainer = document.getElementById('pie-legend');
                if (legendContainer) {
                    legendContainer.innerHTML = categories.map(cat => {
                        const pct = total ? Math.round((cat.value / total) * 100) : 0;
                        return `<span><i style="background:${cat.color}"></i> ${cat.label} (${pct}%) · ${fmtMins(cat.value)}</span>`;
                    }).join('');
                }
            }

        <div class="stats"><div class="card stat"><span class="label">This week's work</span><span class="value">${ts.value}</span><span class="detail">${ts.detail}</span></div><div class="card stat cushion-${gc.kind}"><span class="label">Workload check ${infoBtn('cushion')}</span><span class="value">${gc.label}</span><span class="detail">${gc.detail}</span></div><div class="card stat pie-tile"><span class="label">Week breakdown</span><div class="pie-container"><canvas id="time-pie-canvas" width="56" height="56"></canvas><div id="pie-legend" class="pie-legend"></div></div></div></div>`;
                const timetableSection = `

            // Approximates "check roughly every hour" for how a study planner actually gets used (opened,

            // it (the full breakdown stays available any time via the manual refresh button).
            function maybeAutoCheckSelfStudy() { if (!state.settings.onboarded) return;

                state.lastSelfStudyCheck = now;

                    toast(summary.note); }

            function taskSummary() { const today = localDate(), weekEnd = addDays(today, 7),
                    open = state.tasks.filter(t => !t.done),
                    overdue = open.filter(t => t.due < today).length,
                    dueThisWeek = open.filter(t => t.due >= today && t.due <= weekEnd).length; if (overdue > 0)
                    return { value: String(overdue), detail: `overdue${dueThisWeek?` · ${dueThisWeek} more this week`:''}` };
                if (dueThisWeek > 0) return { value: String(dueThisWeek), detail: 'due this week' };
                return { value: '0', detail: 'Nothing due this week' }; }

            function studyLegend(note) { return `<div class="legend"><span><i></i>Class</span><span><i class="activity"></i>Activity</span><span><i class="sleep"></i>Sleep</span><span><i class="meal"></i>Meal</span><span><i style="background:${STUDY_COLOR}"></i>Study</span><span>${note}</span></div>`; }

            function greeting() { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 18 ?
                    'Good afternoon' : 'Good evening'; }

            function weekBar(target) { return `<div class="weekbar"><h2>${target==='dashboard'?'This week':'Your weekly schedule'}</h2>${target==='dashboard'?weekControls(target):''}</div>`; }

            function timetable(target) {
                const isTemplate = target === 'timetable',
                    anchor = isTemplate ? weekStart(localDate()) : state.week,
                    dates = range(anchor, 7),
                    totalHeight = Math.round(1440 * PX_PER_MIN);
                let html =
                    `<div class="timetable-scroll ${target}" data-target="${target}"><div class="timetable-grid" style="--table-height:${totalHeight}px"><div class="timetable-head time-head"></div>`;
                dates.forEach(d => { const st = isTemplate ? 'normal' : dayStatus(d),
                        today = !isTemplate && d === localDate();
                    html +=
                        `<div class="timetable-head day-head ${today?'today':''} ${st==='holiday'?'holiday':st!=='normal'?'dayoff':''}"><div class="dow">${DAY_NAMES[mondayIndex(d)]}</div>${isTemplate?'':`<div class="date">${dateFrom(d).getDate()}</div>`}</div>`; });
