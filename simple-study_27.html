            function taskGroup(name, items, map, empty) { return `<section class="card task-group"><div class="group-head"><h2>${name}</h2><span class="count">${items.length}</span></div><div class="list">${items.length?items.sort((a,b)=>a.due.localeCompare(b.due)).map(t=>taskRow(t,map)).join(''):`<p class="empty">${empty}</p>`}</div></section>`; }

            const CATEGORY_LABELS = { stem: 'STEM / problem-solving', language: 'Language', humanities: 'Humanities / essay-based',
                practical: 'Practical', other: 'Other' };

            function renderClasses() { const active = state.subjects.filter(s => s.active).sort((a, b) => a.name
                        .localeCompare(b.name)),
                    examSubjects = active.filter(s => s.examSubject !== false),
                    nonExamSubjects = active.filter(s => s.examSubject === false);
                const tile = (s) => { const learning = state.classTopics.filter(t => t.subjectId === s.id && t
                        .status === 'learning').length; return `<button type="button" class="class-tile" data-action="open-subject-detail" data-subject="${s.id}" style="--subject:${s.color}"><strong>${escape(s.name)}</strong><span class="small">${CATEGORY_LABELS[s.category]||'Other'}</span><span class="class-tile-count">${learning?`${learning} topic${learning===1?'':'s'} in progress`:'No topics added yet'}</span></button>`; };
                return appFrame(`<div class="page">${header('Classes',"What's currently being covered in each subject — this is what the Study page draws on.",'')}
        <div class="class-grid">${examSubjects.length?examSubjects.map(tile).join(''):'<p class="empty">Add a class on your Timetable to see it here.</p>'}</div>
        ${nonExamSubjects.length?`<h2 style="margin:22px 0 12px">Non-exam subjects</h2><div class="class-grid">${nonExamSubjects.map(tile).join('')}</div>`:''}
        </div>`); }

            function subjectStudyFocusSummary(subjectId) { const today = localDate(),
                    learning = state.classTopics.filter(t => t.subjectId === subjectId && t.status === 'learning'),
                    needsWork = state.classTopics.filter(t => t.subjectId === subjectId && t.status === 'done' && t
                        .rating === 'bad'),
                    dueForReview = state.classTopics.filter(t => t.subjectId === subjectId && t.status === 'done' &&
                        t.rating !== 'bad' && isClassTopicDue(t, today, 0));
                const parts = []; if (learning.length) parts.push(`reinforcing ${learning.slice(0, 3).map(t => t
                        .label).join(', ')}${learning.length>3?', and more':''} while it's freshly taught`); if (
                    needsWork.length) parts.push(`prioritising review of ${needsWork.slice(0, 3).map(t => t.label)
                        .join(', ')}${needsWork.length>3?', and more':''} since these need more work`); if (
                    dueForReview.length) parts.push(`due for a spaced-repetition review: ${dueForReview.slice(0, 3)
                        .map(t => t.label).join(', ')}${dueForReview.length>3?', and more':''}`); if (!parts
                    .length) { const has = state.classTopics.some(t => t.subjectId === subjectId); return has ?
                        'Nothing urgent right now — everything\'s within its usual review interval.' :
                        'No topics added yet, so study time here uses general review of the subject.'; }
                return `Currently ${parts.join('; ')}.`; }

            function subjectDetailModal(subjectId) { const s = subject(subjectId); if (!s) return modalShell(
                    'Subject', '<p class="empty">This subject no longer exists.</p>',
                    '<button class="button" data-action="close-modal">Close</button>');
                const topics = state.classTopics.filter(t => t.subjectId === subjectId),
                    learning = topics.filter(t => t.status === 'learning'),
                    paused = topics.filter(t => t.status === 'paused'),
                    done = topics.filter(t => t.status === 'done').sort((a, b) => (b.completedDate || '')
                        .localeCompare(a.completedDate || ''));
                const editRow = (t) => `<div class="topic-row"><input type="text" id="topic-edit-input" value="${escape(t.label)}"><button class="button ghost" data-action="classtopic-save-edit" data-topic="${t.id}">Save</button><button class="button ghost" data-action="classtopic-cancel-edit">Cancel</button></div>`;
                const topicLabelSpan = (t) => `<span data-action="open-topic-detail" data-topic="${t.id}" data-return-subject="${subjectId}" style="cursor:pointer" title="Tap for history">${escape(t.label)}</span>`;
                const learningRow = (t) => editingTopicId === t.id ? editRow(t) :
                    `<div class="topic-row">${topicLabelSpan(t)}<div class="row"><button class="button ghost" data-action="classtopic-complete" data-topic="${t.id}" aria-label="Mark complete" title="Mark complete">✓</button><button class="button ghost" data-action="classtopic-pause" data-topic="${t.id}" aria-label="Pause" title="Pause">⏸</button><button class="button ghost" data-action="classtopic-start-edit" data-topic="${t.id}" aria-label="Edit" title="Edit">✎</button><button class="button ghost danger" data-action="classtopic-delete" data-topic="${t.id}" aria-label="Delete" title="Delete">🗑</button></div></div>`;
                const pausedRow = (t) => editingTopicId === t.id ? editRow(t) :
                    `<div class="topic-row">${topicLabelSpan(t)}<div class="row"><button class="button ghost" data-action="classtopic-unpause" data-topic="${t.id}">▶ Unpause</button><button class="button ghost" data-action="classtopic-start-edit" data-topic="${t.id}" aria-label="Edit" title="Edit">✎</button><button class="button ghost danger" data-action="classtopic-delete" data-topic="${t.id}" aria-label="Delete" title="Delete">🗑</button></div></div>`;
                const doneRow = (t) => editingTopicId === t.id ? editRow(t) :
                    `<div class="topic-row">${topicLabelSpan(t)}<div class="row">${[['good','🟢'],['ok','🟡'],['bad','🔴']].map(([id,emoji])=>`<button type="button" class="topic-rating-btn" data-action="classtopic-rate" data-topic="${t.id}" data-rating="${id}" aria-label="${id}" style="opacity:${t.rating===id?'1':'.3'}">${emoji}</button>`).join('')}<button class="button ghost" data-action="classtopic-back-to-learning" data-topic="${t.id}" aria-label="Being reviewed in class again" title="Being reviewed in class again">↩</button><button class="button ghost danger" data-action="classtopic-delete" data-topic="${t.id}" aria-label="Delete" title="Delete">🗑</button></div></div>`;
                const taxEntry = SUBJECT_TAXONOMY.find(t => t.id === s.taxonomyId);
                return modalShell(escape(s.name),
                    `<div class="event-detail"><div class="event-preview" style="background:${s.color};color:${contrast(s.color)}"><strong>${escape(s.name)}</strong><div class="small" style="color:inherit;opacity:.78">${CATEGORY_LABELS[s.category]||'Other'}${s.examSubject===false?' · not an exam subject':''}</div>${taxEntry&&taxEntry.notes?`<div class="small" style="color:inherit;opacity:.9;margin-top:8px">${escape(taxEntry.notes)}</div>`:''}</div>
          <div style="margin-top:16px"><h3>Currently learning in class</h3><div class="list">${learning.length?learning.map(learningRow).join(''):'<p class="empty">Nothing added yet.</p>'}</div><div class="form-grid" style="margin-top:10px"><input type="text" id="classtopic-add-input" placeholder="e.g. Algebra 2" class="field span-2"><button type="button" class="button primary span-2" data-action="classtopic-add" data-subject="${s.id}">+ Add topic</button></div></div>
          ${paused.length?`<div style="margin-top:16px"><h3>Paused</h3><div class="list">${paused.map(pausedRow).join('')}</div></div>`:''}
          <div style="margin-top:16px"><h3>Already learnt</h3><div class="list">${done.length?done.map(doneRow).join(''):'<p class="empty">Nothing completed yet.</p>'}</div></div>
          <div style="margin-top:16px"><h3>What study is currently focused on</h3><p class="small">${subjectStudyFocusSummary(subjectId)}</p></div>
        </div>`,
                    `<button class="button" data-action="close-modal">Close</button>`,
                    true); }

            function topicDetailModal(topicId, returnSubject) { const ct = state.classTopics.find(t => t.id ===
                    topicId); if (!ct)
                    return modalShell('Topic', '<p class="empty">This topic no longer exists.</p>',
                    '<button class="button" data-action="close-modal">Close</button>');
                const s = subject(ct.subjectId),
                    ratings = (ct.difficultyRatings || []).slice().reverse(),
                    lastRating = ratings[0] || null,
                    closeAction = returnSubject ? `data-action="open-subject-detail" data-subject="${returnSubject}"` :
                    'data-action="close-modal"';
                return modalShell(escape(ct.label),
                    `<div class="event-detail"><div class="detail-grid"><div><span>Subject</span><strong>${s?escape(s.name):'—'}</strong></div><div><span>Status</span><strong>${ct.status==='learning'?'Currently learning':ct.status==='paused'?'Paused':'Completed'}</strong></div><div><span>First noted</span><strong>${ct.createdDate?fmtDate(ct.createdDate):'—'}</strong></div><div><span>Last studied</span><strong>${ct.lastStudied?fmtDate(ct.lastStudied):'Not yet'}</strong></div></div>
          <div style="margin-top:14px"><h3>How challenging was it?</h3><p class="small">Optional — only fill this in if you want, it helps future study lean the right way.</p><div class="row" style="margin-top:8px">${[['easy','Easy'],['normal','Normal'],['challenging','Challenging']].map(([id,label])=>`<button type="button" class="button ${lastRating&&lastRating.rating===id?'primary':'ghost'}" data-action="topic-rate-difficulty" data-topic="${ct.id}" data-rating="${id}" data-return-subject="${returnSubject||''}">${label}</button>`).join('')}</div></div>
          ${ratings.length?`<div style="margin-top:14px"><h3>Past check-ins</h3><div class="list">${ratings.slice(0,5).map(r=>`<div class="reminder-row"><span>${fmtDate(r.date)}</span><span class="small">${r.rating}</span></div>`).join('')}</div></div>`:''}
        </div>`,
                    `<button class="button" ${closeAction}>${returnSubject?'← Back':'Close'}</button>`,
                    true); }

            function renderStudy() {
                const plan = ensureStudyPlan(studyViewDate);
                const isToday = studyViewDate === localDate(),
                    canLog = studyViewDate <= localDate();
                const dayNav =
                    `<div class="weekbar"><h2>${isToday?'Today':fmtDate(studyViewDate,{weekday:'long',month:'long',day:'numeric'})}</h2><div class="toolbar"><button class="button" data-action="study-day" data-direction="-1" aria-label="Previous day">← ${DAY_NAMES[mondayIndex(addDays(studyViewDate,-1))]}</button><button class="button" data-action="study-today">Today</button><button class="button" data-action="study-day" data-direction="1" aria-label="Next day">${DAY_NAMES[mondayIndex(addDays(studyViewDate,1))]} →</button></div></div>`;
                const hasAnyStudyBlocks = state.events.some(e => e.type === 'study');
                const blocksHtml = plan && plan.blocks.length ? plan.blocks.map((b, i) => studyBlockCard(b, i + 1,
                        canLog)).join('') :
                    `<section class="card section"><p class="empty">${hasAnyStudyBlocks?'No supervised study block is scheduled for this day.':'Add a study block to your timetable — e.g. after-school supervised study — and this page will automatically plan what to do in it.'}</p>${hasAnyStudyBlocks?'':`<button class="button primary" style="margin-top:10px" data-action="open-event-form">+ Add a study block</button>`}</section>`;
                return appFrame(
                    `<div class="page">${header('Study plan',`What to study in each block, planned for you. ${infoBtn('studyPlan')}`,'')}${dayNav}<div class="study-blocks">${blocksHtml}</div></div>`
                );
            }

            function studyBlockCard(block, index, canLog) { const total = block.end - block.start;
                return `<section class="card study-block"><div class="study-block-head"><h3>Study Block ${index}</h3><span class="pill neutral">${time(block.start)} – ${time(block.end)} · ${fmtMins(total)}</span></div><div class="study-items">${block.items.length?block.items.map(it=>studyItemRow(block,it,canLog)).join(''):'<p class="empty">Nothing planned for this block yet.</p>'}</div></section>`; }

            function studyItemRow(block, item, canLog) { const s = subject(item.subjectId),
                    blockKey = `${block.blockEventId}:${block.blockSlotId}`,
                    isLogging = activeLogItem && activeLogItem.itemId === item.id,
                    clickable = !!item.classTopicId;
                return `<div class="study-item ${item.logged?'logged':''}"><div class="study-item-main" ${clickable?`data-action="open-topic-detail" data-topic="${item.classTopicId}" style="cursor:pointer"`:''}><span class="subject-dot" style="background:${s?s.color:'#999'}"></span><div class="study-item-text"><strong>${escape(item.logged?item.loggedLabel:item.label)}</strong><span class="small">${s?escape(s.name)+' · ':''}${fmtMins(item.minutes)}${item.examName?' · ahead of '+escape(item.examName):''}${clickable?' · tap for history':''}</span></div></div>${item.logged?`<span class="pill good">Logged ✓</span>`:canLog?`<button class="button ghost" data-action="start-log" data-block="${blockKey}" data-item="${item.id}">Log this</button>`:''}</div>${isLogging?`<div class="log-form"><input type="text" id="log-input-${item.id}" value="${escape(item.label.replace(/^(Prep: |Review: |Quick review: )/,''))}" placeholder="What did you actually study?"><button class="button primary" data-action="submit-log" data-block="${blockKey}" data-item="${item.id}">Save</button><button class="button ghost" data-action="cancel-log">Cancel</button></div>`:''}`; }

            function renderTimetable() { const holidays = state.holidays.sort((a, b) => a.start.localeCompare(b.start));
                const timetableSection = `
        <section class="card timeline-card">
          ${weekBar('timetable')}
          ${timetable('timetable')}
          ${studyLegend('Click a block to inspect, edit, or remove it.')}
        </section>`;
                const sidebarContent = `
        <div class="timetable-info-grid">
          <section class="card side-note">
            <div class="section-title"><h2>Dates away</h2><button class="button icon" data-action="open-holiday-form" aria-label="Add holiday or day off">＋</button></div>
            <div class="holiday-list">${holidays.length?holidays.map(h=>`<div class="holiday-row"><div><strong>${h.kind==='holiday'?'☼':'◌'} ${escape(h.name)}</strong><span>${fmtDate(h.start)} – ${fmtDate(h.end)} · ${h.kind==='holiday'?'holiday':'day off'}</span></div><button class="button ghost danger" data-action="delete-holiday" data-id="${h.id}" aria-label="Delete ${escape(h.name)}">×</button></div>`).join(''):`<p class="empty">Add holidays or day-off dates here.</p>`}</div>
          </section>
        </div>`;
                return appFrame(
                    `<div class="page">${header('Timetable','Your regular weekly classes, activities, and study blocks.',`<button class="button primary fab" aria-label="Add to timetable" data-action="open-event-form">＋</button>`)}</div><div class="full-width-wrapper">${timetableSection}</div><div class="page">${sidebarContent}</div>`
                    );
            }

            function renderTestsExams() { const items = state.exams.slice().sort((a, b) => (a.start || '9999')
                        .localeCompare(b.start || '9999')),
                    tests = items.filter(x => x.assessmentType === 'test'),
                    exams = items.filter(x => x.assessmentType !== 'test');
                const row = (x) => { const cao = examCaoResults(x.id),
                        caoBadge = cao ? `<span class="pill ${cao.pending?'':'good'}">${cao.pending?'Awaiting results':`${cao.total} pts`}</span>` :
                        '';
                    return `<div class="holiday-row" data-action="${x.assessmentType==='test'?'open-test-detail':'open-exam-schedule'}" data-id="${x.id}" style="cursor:pointer"><div><strong>${escape(examDisplayName(x))}</strong><span>${x.start&&x.end?(x.start===x.end?fmtDate(x.start):`${fmtDate(x.start)} – ${fmtDate(x.end)}`):'No date set'} · ${(x.sittings||[]).length} subject${(x.sittings||[]).length===1?'':'s'}</span></div>${caoBadge}<button class="button ghost danger" data-action="delete-exam" data-id="${x.id}" aria-label="Delete ${escape(examDisplayName(x))}">×</button></div>`; };
                return appFrame(`<div class="page">${header('Tests and Exams',"Everything you're being assessed on, from class tests to state exams.",`<button class="button primary" data-action="add-exam">＋ Add a test or exam</button>`)}
        <div class="timetable-info-grid">
          <section class="card side-note"><div class="section-title"><h2>Tests</h2></div><div class="holiday-list">${tests.length?tests.map(row).join(''):'<p class="empty">No tests added yet.</p>'}</div></section>
          <section class="card side-note"><div class="section-title"><h2>Exams</h2><div class="row">${infoBtn('extraStudy')}</div></div><div class="holiday-list">${exams.length?exams.map(row).join(''):`<p class="empty">Add the real exams you're building up to — Christmas/Summer exams, Mocks, JC/LC.</p>`}</div></section>
        </div></div>`); }

            function schoolYearHasEnded() { const { termStart, termEnd } = state.settings; if (!termStart || !termEnd)
                    return false;
                const effectiveEnd = latestExamDateAfter(termEnd) || termEnd;
                return localDate() > effectiveEnd; }

            const NEXT_YEAR_GROUP = { '1st': '2nd', '2nd': '3rd', '4th': '5th', '5th': '6th', '6th': '6th' };

            function yearRolloverModal() { const y = state.settings.yearGroup; if (y === '3rd') return modalShell(
                    'New school year',
                    `<div class="onboarding"><div class="brand-mark">🎉</div><h2>3rd Year is done!</h2><p>I've cleared last year's timetable and exams so you can start fresh. Are you moving into 4th Year, or heading straight to 5th?</p></div>`,
                    `<button class="button" data-action="rollover-pick-year" data-year="5th">5th Year</button><button class="button primary" data-action="rollover-pick-year" data-year="4th">4th Year</button>`,
                    false, true); const nextYear = NEXT_YEAR_GROUP[y] || y;
                return modalShell('New school year',
                    `<div class="onboarding"><div class="brand-mark">🎉</div><h2>Welcome to ${nextYear?`${nextYear} Year`:'your new school year'}!</h2><p>I've cleared last year's timetable and exams so you can start fresh. Head to Settings to set this year's term dates when you're ready.</p></div>`,
                    `<button class="button primary" data-action="rollover-pick-year" data-year="${nextYear}">Sounds good</button>`,
                    false, true); }

            function performRollover(newYearGroup) { state.events = [];
                state.exams = [];
                state.studyPlans = {};
                state.topics = []; if (newYearGroup) state.settings.yearGroup = newYearGroup;
                state.settings.termStart = '';
                state.settings.termEnd = '';
                save();
                closeModal();
                render();
                toast("Cleared last year's timetable — set this year's term dates in Settings whenever you're ready."); }

            function render() { document.body.classList.toggle('dark', state.settings.theme === 'dark'); if (view ===
                    'dashboard') { renderDashboard(); } else if (view === 'tasks') { document.getElementById('app')
                    .innerHTML = renderTasks(); } else if (view === 'study') { document.getElementById('app')
                    .innerHTML = renderStudy(); } else if (view === 'classes') { document.getElementById('app')
                    .innerHTML = renderClasses(); } else if (view === 'tests-exams') { document.getElementById('app')
                    .innerHTML = renderTestsExams(); } else { document.getElementById('app').innerHTML = renderTimetable();
                    requestAnimationFrame(() => restoreTimetableScroll('timetable')); } if (
                    !state.settings.onboarded && !modal) openModal('onboarding');
                else if (state.settings.onboarded && !modal && schoolYearHasEnded()) openModal('year-rollover'); }

            function openModal(kind, data = {}) { modal = { kind, ...data };
                renderModal(); if (mascotTour) positionMascotWidget(currentMascotStep()); }

            function closeModal() { modal = null;
                selected = null;
                editingTopicId = null;
                const layer = document.getElementById('modal-layer');
                layer.classList.remove('open');
                layer.setAttribute('aria-hidden', 'true');
                layer.innerHTML = '';
                if (mascotTour) positionMascotWidget(currentMascotStep()); }

            function renderModal() { if (openPicker) closePicker(); const layer = document.getElementById('modal-layer');
                layer.classList.add('open');
                layer.setAttribute('aria-hidden', 'false'); if (!modal) return; if (modal.kind === 'onboarding')
                    return layer.innerHTML = onboardingModal(); if (modal.kind === 'year-rollover') return layer
                    .innerHTML = yearRolloverModal(); if (modal.kind === 'settings') return layer.innerHTML =
                    settingsModal(); if (modal.kind === 'study-preferences') return layer.innerHTML =
                    studyPreferencesModal(); if (modal.kind === 'event-form') return layer.innerHTML = eventModal(modal
                    .event); if (modal.kind === 'holiday-form') return layer.innerHTML = holidayModal(modal
                .holiday); if (modal.kind === 'event-details') return layer.innerHTML = eventDetailsModal(modal
                    .event, modal.slot, !!modal.dashboard, modal.date); if (modal.kind === 'task-form') return layer.innerHTML =
                    taskModal(modal.task); if (modal.kind === 'exam-wizard') return layer.innerHTML = examWizardModal(); if (
                    modal.kind === 'exam-schedule') return layer.innerHTML = examScheduleModal(modal.examId); if (
                    modal.kind === 'exam-result') return layer.innerHTML = examResultModal(modal.examId, modal
                    .subjectId); if (
                    modal.kind === 'cao-results') return layer.innerHTML = examCaoResultsModal(modal.examId); if (
                    modal.kind === 'self-study-plan') return layer.innerHTML = selfStudyPlanSummaryModal(modal
                    .summary); if (
                    modal.kind === 'test-detail') return layer.innerHTML = testDetailModal(modal.examId); if (
                    modal.kind === 'subject-detail') return layer.innerHTML = subjectDetailModal(modal.subjectId); if (
                    modal.kind === 'topic-detail') return layer.innerHTML = topicDetailModal(modal.topicId, modal
                    .returnSubject); if (
                    modal.kind === 'info') return layer.innerHTML = infoModal(modal.topic); }

            const INFO_TEXT = {
                cushion: { title: 'How the workload check works', body: 'Your "cushion" is how much free time you have left before a task is due, after earlier deadlines have already claimed their share. Negative means you\'re realistically short on time; under two hours is tight; more than that is comfortable.' },
                extraStudy: { title: 'How exam study time works', body: "Add an exam and its subjects get extra weight in your study blocks as it gets closer, tapering off to light review in exam week." },
                studyPlan: { title: 'How the Study page works', body: 'Each study block on your timetable is filled automatically — using tasks due soon, topics due for review, and how each subject is tracking, with more weight given to subjects with an exam coming up. Log what you actually studied afterwards and it gets scheduled for review again later.' }
            };
            function infoModal(topic) { const info = INFO_TEXT[topic] || { title: 'Info', body: '' };
                return modalShell(info.title, `<p>${escape(info.body)}</p>`,
                    `<button class="button primary" data-action="close-modal">Got it</button>`); }
            function infoBtn(topic, light) { return `<button class="button icon info-btn${light?' light':''}" data-action="show-info" data-topic="${topic}" aria-label="How this works" title="How this works">i</button>`; }

            function modalShell(title, body, foot = '', large = false, noClose = false) { return `<div class="modal ${large?'large':''}" role="dialog" aria-modal="true" aria-label="${escape(title)}"><div class="modal-head"><h2>${title}</h2>${noClose?'':'<button class="button icon" data-action="close-modal" aria-label="Close">×</button>'}</div><div class="modal-body">${body}</div>${foot?`<div class="modal-foot">${foot}</div>`:''}</div>`; }

            function finishOnboarding() { state.settings.onboarded = true;
                save();
                closeModal();
                render(); }

            function onboardingModal() {
                const s = state.settings;
                if (onboardingStep === 1) return modalShell(`Welcome · Step 1 of 5`,
                    `<div class="onboarding"><div class="brand-mark">✦</div><h2>Let's get you set up.</h2><p>First, what should we call you?</p><div class="form-grid"><div class="field" style="text-align:left"><label for="onboarding-first-name">First name</label><input id="onboarding-first-name" autofocus placeholder="First name" value="${escape(s.firstName)}"></div><div class="field" style="text-align:left"><label for="onboarding-last-name">Last name</label><input id="onboarding-last-name" placeholder="Last name" value="${escape(s.lastName)}"></div></div></div>`,
                    `<button class="button primary" data-action="onboarding-next-1">Continue →</button>`, false, true);
                if (onboardingStep === 2) return modalShell(`Welcome · Step 2 of 5`,
                    `<div class="onboarding"><div class="brand-mark">🎂</div><h2>When's your birthday${s.firstName?`, ${escape(s.firstName)}`:''}?</h2><p>Optional for now — handy for a birthday shout-out later, and maybe to keep study light that day.</p><div class="field" style="text-align:left"><label for="onboarding-dob">Date of birth</label>${pickerFieldHtml('id="onboarding-dob"','date',s.dob)}</div></div>`,
                    `<button class="button ghost" data-action="onboarding-skip-2">Skip</button><button class="button primary" data-action="onboarding-next-2">Continue →</button>`, false, true);
                if (onboardingStep === 3) return modalShell(`Welcome · Step 3 of 5`,
                    `<div class="onboarding"><div class="brand-mark">🎓</div><h2>What year are you in?</h2><div class="type-picker">${YEAR_GROUPS.map(y=>`<button type="button" class="type-option ${s.yearGroup===y?'selected':''}" style="min-height:52px;display:grid;place-items:center;font-weight:800;font-size:15px" data-action="onboarding-pick-year" data-year="${y}">${y} Year</button>`).join('')}</div></div>`,
                    `<button class="button primary" data-action="onboarding-next-3">Continue →</button>`, false, true);
                if (onboardingStep === 4) return modalShell(`Welcome · Step 4 of 5`,
                    `<div class="onboarding"><div class="brand-mark">🗓️</div><h2>When does this school year run?</h2><p>Your timetable only applies between these dates — so next year nothing needs deleting, the app will just know this school year has ended.</p><div class="form-grid"><div class="field" style="text-align:left"><label for="onboarding-term-start">Term starts</label>${pickerFieldHtml('id="onboarding-term-start"','date',s.termStart)}</div><div class="field" style="text-align:left"><label for="onboarding-term-end">Term ends</label>${pickerFieldHtml('id="onboarding-term-end"','date',s.termEnd)}</div></div></div>`,
                    `<button class="button primary" data-action="onboarding-next-4">Continue →</button>`, false, true);
                // Step 5: hand off to the Timetable page, where the AI setup assistant takes over
                return modalShell(`Welcome · Step 5 of 5`,
                    `<div class="onboarding"><div class="brand-mark">📚</div><h2>Last step — let's build your timetable.</h2><p>I'll take you to your Timetable page, where an assistant will help you set everything up — whether you've got a photo of your timetable or want to build it by hand.</p></div>`,
                    `<button class="button primary" data-action="onboarding-finish">Let's go →</button>`, false, true); }

            function studyPreferencesModal() { const sp = state.settings.studyPreferences || {},
                    showPoints = ['5th', '6th'].includes(state.settings.yearGroup),
                    chipGroup = (field, options) => `<div class="type-picker" style="grid-template-columns:1fr">${options.map(([id,label])=>`<button type="button" class="type-option ${sp[field]===id?'selected':''}" data-action="studyprefs-pick" data-field="${field}" data-value="${id}" style="text-align:left;min-height:44px">${label}</button>`).join('')}</div>`;
                return modalShell('Study preferences',
                    `<div class="onboarding" style="text-align:left"><p>A few quick questions so the Study page plans the right amount of self-directed study for you. Nothing here is locked in — change it anytime.</p>
          <div class="field" style="margin-top:14px"><label>How much do you want to study overall?</label>${chipGroup('intensity',[['light','Light — a bit here and there'],['moderate','Moderate — a solid regular routine'],['intense','Intense — as much as realistically fits']])}</div>

            function settingsModal() { const s = state.settings;

          <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:10px"><div><strong>School year</strong><span class="small">Your timetable only applies between these dates.</span></div><div class="form-grid"><div class="field"><label for="setting-term-start">Term starts</label>${pickerFieldHtml('id="setting-term-start"','date',s.termStart)}</div><div class="field"><label for="setting-term-end">Term ends</label>${pickerFieldHtml('id="setting-term-end"','date',s.termEnd)}</div></div></div>
          <div class="settings-row"><div><strong>Appearance</strong><span class="small">Use a darker surface after sunset.</span></div><label class="switch-row"><input id="setting-theme" type="checkbox" ${s.theme==='dark'?'checked':''}> Dark mode</label></div>
          <div class="settings-row" style="flex-direction:column;align-items:stretch;gap:10px"><div><strong>Sidebar</strong><span class="small">How the sidebar behaves.</span></div><div class="row">${[['hover','Expand on hover'],['expanded','Always expanded'],['collapsed','Always collapsed']].map(([m,l])=>`<button type="button" class="button ${((s.sidebarMode||'hover')===m)?'primary':'ghost'}" data-action="set-sidebar-mode" data-mode="${m}">${l}</button>`).join('')}</div></div>
          <div class="settings-row"><div><strong>Study preferences</strong><span class="small">How much and when you'd like to study.</span></div><button class="button" data-action="open-study-preferences">Edit</button></div>
          <div class="settings-row"><div><strong>Backup your data</strong><span class="small">Everything is stored only in this browser — export a backup file now and then, or move it to another device with Import.</span></div><div class="row"><button class="button" data-action="export-data">Export backup</button><label class="button">Import backup<input id="import-data" type="file" accept="application/json" class="hidden"></label></div></div>
          <div class="settings-row"><div><strong>Sample data</strong><span class="small">Fills in a full week of classes, activities, and study — handy for testing.</span></div><button class="button" data-action="sample-data">Add sample week</button></div>
          <div class="settings-row"><div><strong>Start over</strong><span class="small">This clears only Simple Study's saved data.</span></div><button class="button danger" data-action="reset-data">Reset</button></div>
        </div>`,
                    `<button class="button primary" data-action="save-settings">Save settings</button>`); }

            function eventModal(existing) { const base = { type: 'class', name: '', subjectId: '', color: '#335CFF',
                    inSchool: false, studyKind: 'self', details: '', date: '', slots: [{ id: uid(), days: [],
                        start: '09:00', end: '10:00' }] };
                const e = { ...base, ...(existing || {}), slots: existing?.slots?.length ? existing.slots : base
                    .slots };
                const used = usedColors(e.id);
                const typeCards = Object.entries(TYPE_INFO).filter(([k]) => k !== 'holiday' && k !== 'examSitting').map(([k, v]) =>
                    `<button class="type-option ${e.type===k?'selected':''}" data-action="set-event-type" data-type="${k}"><span class="symbol">${v.icon}</span><strong>${v.label}</strong><span>${v.description}</span></button>`
                    ).join('');
                const needsName = !['sleep'].includes(e.type);
                const isStudy = e.type === 'study';
                const isClass = e.type === 'class';
                const linkedSubject = e.subjectId ? subject(e.subjectId) : null;
                const examSubjectChecked = linkedSubject ? linkedSubject.examSubject !== false : true;
                const available = PALETTE.filter(c => (!used.has(c) || c === e.color) && c !== STUDY_COLOR && c !==
                    STUDY_COLOR_SUPERVISED);
                return modalShell(e.editSlotId ? 'Edit this time' : existing ? 'Edit timetable event' :
                    'Add to timetable',
                    `<div class="type-picker">${typeCards}</div><form id="event-form" style="margin-top:18px"><input type="hidden" id="event-id" value="${escape(e.id||'')}"><div class="form-grid"><div class="field ${isStudy?'span-2':'hidden'}"><label>Type of study</label><div class="type-picker" style="grid-template-columns:1fr 1fr"><button type="button" class="type-option ${e.studyKind!=='supervised'?'selected':''}" data-action="set-study-kind" data-kind="self"><strong>Self study</strong><span>Can be skipped or moved</span></button><button type="button" class="type-option ${e.studyKind==='supervised'?'selected':''}" data-action="set-study-kind" data-kind="supervised"><strong>Supervised study</strong><span>Always happens — e.g. compulsory study hall</span></button></div></div><div class="field ${needsName?'':'hidden'}"><label for="event-name">${isStudy?'Study block name':'Name'}</label><input id="event-name" ${needsName?'required':''} value="${escape(e.name)}" placeholder="${isStudy?'e.g. Maths past paper':isClass?'e.g. Maths':'e.g. Spanish class'}"></div><div class="field ${isClass?'':'hidden'}"><label class="switch-row"><input id="event-exam-subject" type="checkbox" ${examSubjectChecked?'checked':''}> This is an exam subject <span class="small">Uncheck for non-exam classes like SPHE or PE — homework for it still counts, but it won't be used to fill spare study time.</span></label></div><div class="field ${isStudy?'':'hidden'}"><label for="event-subject">Subject</label><select id="event-subject"><option value="">No subject</option>${state.subjects.filter(s=>s.active).map(s=>`<option value="${s.id}" ${s.id===e.subjectId?'selected':''}>${escape(s.name)}</option>`).join('')}</select></div><div class="field ${e.type==='class'?'':'hidden'}"><label for="event-teacher">Teacher / room</label><input id="event-teacher" value="${escape(e.teacher||'')}" placeholder="Optional"></div><div class="field ${['activity','study'].includes(e.type)?'':'hidden'}"><label class="switch-row"><input id="event-school" type="checkbox" ${e.inSchool?'checked':''}> This happens in school</label></div><div class="field ${e.type==='sleep'?'hidden':''}"><label>Colour</label><input type="hidden" id="event-color" value="${e.type==='study'?studyColorFor(e.studyKind):e.color}"><div class="color-picker">${e.type==='study'?`<button class="color-choice selected" style="background:${studyColorFor(e.studyKind)}" aria-label="Study colour" type="button"></button>`:available.map(c=>`<button type="button" class="color-choice ${c===e.color?'selected':''}" style="background:${c}" data-action="pick-color" data-color="${c}" aria-label="Choose colour"></button>`).join('')}</div></div><div class="field span-2"><label for="event-details">Details</label><textarea id="event-details" placeholder="Optional notes, location, or study method">${escape(e.details||'')}</textarea></div><div class="field span-2"><label class="switch-row"><input id="event-weekly" type="checkbox" ${!e.date?'checked':''}> Repeat weekly <span class="small">Turn off for a single dated session.</span></label></div><div class="field span-2 ${e.date?'':'hidden'}" id="event-date-wrap"><label for="event-date">Date</label>${pickerFieldHtml('id="event-date"','date',e.date||localDate())}</div></div><div id="slots">${e.slots.map(slotForm).join('')}</div><button type="button" class="button" style="margin-top:12px" data-action="add-slot">+ Another time</button></form>`,
                    `<button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="save-event">${existing?'Save changes':'Add event'}</button>`,
                    true); }

            function slotForm(slot) { return `<div class="slot" data-slot-id="${slot.id}"><div class="slot-top"><div class="field"><label>Start</label>${pickerFieldHtml('class="slot-start"','time',slot.start)}</div><div class="field"><label>End</label>${pickerFieldHtml('class="slot-end"','time',slot.end)}</div><button type="button" class="button icon danger" data-action="remove-slot" aria-label="Remove time">×</button></div><div class="day-chips">${DAY_NAMES.map((d,i)=>`<button type="button" class="day-chip ${(slot.days||[]).includes(i)?'active':''}" data-action="toggle-day" data-day="${i}">${d}</button>`).join('')}</div></div>`; }

            function holidayModal(h) { const x = h || { name: '', start: localDate(), end: localDate(),
                    kind: 'holiday' }; return modalShell(h ? 'Edit date away' : 'Add dates away',
                    `<form id="holiday-form"><input id="holiday-id" type="hidden" value="${x.id||''}"><div class="form-grid"><div class="field span-2"><label for="holiday-name">Name</label><input id="holiday-name" required value="${escape(x.name)}" placeholder="e.g. October midterm"></div><div class="field"><label for="holiday-start">Start date</label>${pickerFieldHtml('id="holiday-start"','date',x.start)}</div><div class="field"><label for="holiday-end">End date</label>${pickerFieldHtml('id="holiday-end"','date',x.end)}</div><div class="field span-2"><label for="holiday-kind">What should be paused?</label><select id="holiday-kind"><option value="holiday" ${x.kind==='holiday'?'selected':''}>Holiday — hide regular classes and activities</option><option value="dayoff" ${x.kind==='dayoff'?'selected':''}>Day off — hide school classes and in-school events</option></select></div></div></form>`,
                    `<button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="save-holiday">Save dates</button>`
                    ); }

            function taskModal(existing) { const t = existing || { title: '', type: 'homework', subjectId: '',
                    due: localDate(), minutes: 60, online: false, important: false, details: '' }; return modalShell(
                    existing ? 'Edit task' : 'Add task',
                    `<form id="task-form"><input id="task-id" type="hidden" value="${t.id||''}"><div class="form-grid"><div class="field span-2"><label for="task-title">Task</label><input id="task-title" required value="${escape(t.title)}" placeholder="e.g. Finish algebra worksheet"></div><div class="field"><label for="task-type">Type</label><select id="task-type"><option value="homework" ${t.type==='homework'?'selected':''}>Homework</option>${t.type==='test'?'<option value="test" selected>Test (legacy — recreate this under Tests &amp; Exams)</option>':''}<option value="project" ${t.type==='project'?'selected':''}>Project</option></select></div><div class="field"><label for="task-subject">Subject</label><select id="task-subject"><option value="">No subject</option>${state.subjects.filter(s=>s.active).map(s=>`<option value="${s.id}" ${s.id===t.subjectId?'selected':''}>${escape(s.name)}</option>`).join('')}</select></div><div class="field"><label for="task-due">Due date</label>${pickerFieldHtml('id="task-due"','date',t.due)}</div><div class="field ${t.type==='test'?'hidden':''}" id="task-minutes-wrap"><label for="task-minutes">Time needed (minutes)</label><input id="task-minutes" type="number" min="0" step="5" value="${t.minutes||60}"></div><div class="field span-2 ${t.type==='test'?'hidden':''}" id="task-online-wrap"><label class="switch-row"><input id="task-online" type="checkbox" ${t.online?'checked':''}> Can submit online <span class="small">Otherwise it is due at the subject's first class that day.</span></label></div><div class="field span-2 ${t.type==='homework'?'hidden':''}" id="task-important-wrap"><label class="switch-row"><input id="task-important" type="checkbox" ${t.important?'checked':''}> Important / graded</label></div><div class="field span-2"><label for="task-details">Notes</label><textarea id="task-details" placeholder="Optional next step or requirements">${escape(t.details||'')}</textarea></div></div></form>`,
                    `<button class="button" data-action="close-modal">Cancel</button><button class="button primary" data-action="save-task">${existing?'Save changes':'Add task'}</button>`
                    ); }

            function examDisplayName(x) { if (x.assessmentType === 'test') { const subjId = (x.sittings || [])[0]
                    ?.subjectId, subj = subjId ? subject(subjId) : null; return `${subj?subj.name:x.name||'Subject'} test`; }
                return x.kind === 'other' ? (x.name || 'Exam') : (EXAM_KINDS.find(k =>
                k.id === x.kind)?.label || 'Exam'); }

            function examSubjectsList() { return state.subjects.filter(s => s.active && s.examSubject !== false); }

            // Finds what time a subject's class is on for a given date, so a test's time can be derived
            // automatically instead of asking — there's no reason to ask separately when it's just whenever
            // that class already happens that day.
            function classTimeOnDate(subjectId, date) { if (!subjectId || !date) return null;
                const classEvent = state.events.find(e => e.type === 'class' && e.subjectId === subjectId); if (
                    !classEvent) return null;
                const slot = classEvent.slots.find(s => sourceMatches(classEvent, date, s));
                return slot ? slot.start : null; }

            function datesInRange(start, end) { if (!start || !end || end < start) return []; const out = []; let cur =
                    start, guard = 0; while (cur <= end && guard < 400) { out.push(cur);
                    cur = addDays(cur, 1);
                    guard++; }
                return out; }

            function startExamWizard(existing) { examWizard = existing ? { step: existing.assessmentType === 'test' ?
                    't-datetime' : 1, assessmentType: existing.assessmentType || 'exam', editingId: existing.id,
                    kind: existing.kind, name: existing.name || '', start: existing.start || '',
                    end: existing.end || '', examSubjects: [], subjectIndex: 0, testSubjectId: (existing.sittings ||
                        [])[0]?.subjectId || '', sittings: (existing.sittings || []).map(s => ({ ...s,
                        topics: (s.topics || []).slice() })), pendingTopics: (existing.sittings || [])[0]?.topics
                        ?.slice() || [], pendingTopicsUnknown: !!(existing.sittings || [])[0]?.topicsUnknown,
                    photo: null } : { step: 0, assessmentType: '', editingId: null, kind: '', name: '', start: '',
                    end: '', examSubjects: [], subjectIndex: 0, testSubjectId: '', sittings: [], pendingTopics: [],
                    pendingTopicsUnknown: false, photo: null };
                openModal('exam-wizard'); }

            function topicAssignmentBlock(subjectId) { const topics = state.classTopics.filter(t => t.subjectId ===
                        subjectId && t.status !== 'paused'),
                    selected = examWizard.pendingTopics || [], unknown = !!examWizard.pendingTopicsUnknown;
                return `<div style="margin-top:14px;text-align:left"><h3 style="margin-bottom:8px">Which topics are on it?</h3><div class="list">${topics.length?topics.map(t=>`<label class="switch-row" style="background:var(--surface-2);padding:8px 10px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px;opacity:${unknown?'.5':'1'}"><input type="checkbox" class="examwizard-topic-check" data-topic="${t.id}" ${selected.includes(t.id)?'checked':''} ${unknown?'disabled':''}> ${escape(t.label)}</label>`).join(''):'<p class="empty">No topics tracked for this subject yet — add one below if it\'s covered.</p>'}</div><div class="form-grid" style="margin-top:8px"><input type="text" id="examwizard-new-topic-input" placeholder="Add a topic not yet in class" class="field span-2" ${unknown?'disabled':''}><button type="button" class="button span-2" data-action="examwizard-add-topic" data-subject="${subjectId}" ${unknown?'disabled':''}>+ Add topic</button></div><label class="switch-row" style="margin-top:10px"><input type="checkbox" id="examwizard-topics-unknown" ${unknown?'checked':''}> Unknown — could be anything already covered</label></div>`; }

            function examWizardModal() { const ew = examWizard; if (ew.photo) return modalShell('Add a test or exam',
                    `<div class="onboarding"><div class="brand-mark">📷</div><h2>Send this to the AI?</h2><p>It'll read the exam timetable and add everything for you.</p><div class="ai-chat-attachment" style="border:1px solid var(--line);border-radius:11px;margin-top:14px"><img src="${ew.photo.dataUrl}" style="width:56px;height:56px" alt="Attached photo"><span>${escape(ew.photo.name)}</span></div></div>`,
                    `<button class="button ghost" data-action="examwizard-remove-photo">Choose a different photo</button><button class="button primary" data-action="examwizard-send-photo">Send to AI →</button>`);
                if (ew.step === 0) return modalShell('Add a test or exam',
                    `<div class="onboarding"><div class="brand-mark">📝</div><h2>Is this a test or an exam?</h2><p>Exams cover a period with several subjects sitting at different times. A test is one subject, one day.</p><div class="type-picker"><button type="button" class="type-option ${ew.assessmentType==='test'?'selected':''}" data-action="examwizard-pick-type" data-type="test">Test</button><button type="button" class="type-option ${ew.assessmentType==='exam'?'selected':''}" data-action="examwizard-pick-type" data-type="exam">Exam</button></div></div>`,
                    `<input type="file" id="examwizard-file" accept="image/*" class="hidden"><button class="button ghost" data-action="examwizard-attach-photo">📷 Set up with a photo instead</button>`);
                if (ew.assessmentType === 'test') {
                    if (ew.step === 't-subject') { const subjects = examSubjectsList();
                        return modalShell('Add a test',
                            `<div class="onboarding"><div class="brand-mark">📚</div><h2>Which subject?</h2><div class="type-picker">${subjects.length?subjects.map(s=>`<button type="button" class="type-option ${ew.testSubjectId===s.id?'selected':''}" data-action="examwizard-pick-test-subject" data-subject="${s.id}">${escape(s.name)}</button>`).join(''):'<p class="empty">No exam subjects yet — add a class first.</p>'}</div></div>`,
                            `<button class="button ghost" data-action="examwizard-back-to-0">← Back</button>`); }
                    const testSubj = subject(ew.testSubjectId); if (!testSubj) { ew.step = 't-subject';
                        return examWizardModal(); }
                    if (ew.step === 't-datetime') { const existingSitting = ew.sittings[0];
                        return modalShell('Add a test',
                            `<div class="onboarding"><div class="brand-mark" style="background:${testSubj.color}22;color:${testSubj.color}">🗓️</div><h2>${escape(testSubj.name)} test</h2><p>What day is it? The time will use ${escape(testSubj.name)}'s usual class time that day.</p><div class="field" style="text-align:left">${pickerFieldHtml('id="examwizard-test-date"','date',existingSitting?.date||'')}</div></div>`,
                            `<button class="button ghost" data-action="examwizard-back-to-test-subject">← Back</button><button class="button primary" data-action="examwizard-next-test-datetime">Continue →</button>`); }
                    // t-topics
                    return modalShell('Add a test',
                        `<div class="onboarding"><div class="brand-mark" style="background:${testSubj.color}22;color:${testSubj.color}">✎</div><h2>${escape(testSubj.name)} test</h2>${topicAssignmentBlock(testSubj.id)}</div>`,
                        `<button class="button ghost" data-action="examwizard-back-to-test-datetime">← Back</button><button class="button primary" data-action="examwizard-finish-test">Save test</button>`);
                }
                if (ew.step === 1) { const year = state.settings.yearGroup,
                        kindOptions = EXAM_KINDS.filter(k => (k.id !== 'jc' || year === '3rd') && (k.id !== 'lc' ||
                            year === '6th') && (k.id !== 'mock' || year === '3rd' || year === '6th'));
                    return modalShell('Add an exam',
                        `<div class="onboarding"><div class="brand-mark">📝</div><h2>What kind of exam is this?</h2><div class="type-picker">${kindOptions.map(k=>`<button type="button" class="type-option ${ew.kind===k.id?'selected':''}" data-action="examwizard-pick-kind" data-kind="${k.id}">${k.label}</button>`).join('')}</div>${ew.kind==='other'?`<div class="field" style="text-align:left;margin-top:12px"><label for="examwizard-name">Name this exam</label><input id="examwizard-name" placeholder="e.g. English oral practicals" value="${escape(ew.name)}"></div>`:''}</div>`,
                        `<button class="button ghost" data-action="examwizard-back-to-0">← Back</button><button class="button primary" data-action="examwizard-next-1">Continue →</button>`); }
                if (ew.step === 2) return modalShell('Add an exam',
                    `<div class="onboarding"><div class="brand-mark">🗓️</div><h2>When does this exam period run?</h2><p>Subjects usually sit at different times across this period — you'll set each one's day and time next.</p><div class="form-grid"><div class="field" style="text-align:left"><label for="examwizard-start">Starts</label>${pickerFieldHtml('id="examwizard-start"','date',ew.start)}</div><div class="field" style="text-align:left"><label for="examwizard-end">Ends</label>${pickerFieldHtml('id="examwizard-end"','date',ew.end)}</div></div></div>`,
                    `<button class="button ghost" data-action="examwizard-back-to-1">← Back</button><button class="button primary" data-action="examwizard-next-2">Continue →</button>`);
                // step 3: walk through each exam subject one at a time
                const subj = subject(ew.examSubjects[ew.subjectIndex]); if (!subj) return modalShell('Add an exam',
                    `<div class="onboarding"><div class="brand-mark">✓</div><h2>All set.</h2><p>${ew.sittings.length?`${ew.sittings.length} subject${ew.sittings.length===1?'':'s'} scheduled for this exam period.`:"You don't have any exam subjects yet — add classes and mark them as exam subjects first, then come back to add sitting times."}</p></div>`,
                    `<button class="button primary" data-action="examwizard-finish">Done</button>`);
                const existingSitting = ew.sittings.find(s => s.subjectId === subj.id),
                    dayOptions = datesInRange(ew.start, ew.end),
                    topicsApplicable = !['jc', 'lc', 'mock'].includes(ew.kind);
                return modalShell('Add an exam',
                    `<div class="onboarding"><div class="brand-mark" style="background:${subj.color}22;color:${subj.color}">✎</div><h2>${escape(subj.name)}</h2><p>Subject ${ew.subjectIndex+1} of ${ew.examSubjects.length} — what day and time is this exam?</p><div class="form-grid"><div class="field" style="text-align:left"><label for="examwizard-sitting-date">Day</label><select id="examwizard-sitting-date">${dayOptions.map(d=>`<option value="${d}" ${(existingSitting?.date||dayOptions[0])===d?'selected':''}>${fmtDate(d,{weekday:'short',day:'numeric',month:'short'})}</option>`).join('')}</select></div><div class="field" style="text-align:left"><label for="examwizard-sitting-time">Time</label>${pickerFieldHtml('id="examwizard-sitting-time"','time',existingSitting?.time||'09:30')}</div></div>${topicsApplicable?topicAssignmentBlock(subj.id):''}</div>`,
                    `<button class="button ghost" data-action="examwizard-skip-subject">Skip — no exam this period</button><button class="button primary" data-action="examwizard-next-subject">${ew.subjectIndex+1>=ew.examSubjects.length?'Finish':'Next →'}</button>`); }

            function openExamSchedule(examId) { const ex = state.exams.find(x => x.id === examId); if (!ex) return;

            function examSegmentsForDate(examId, date) { const ex = state.exams.find(x => x.id === examId); if (!ex)

            function testConfidence(examId) { const ex = state.exams.find(x => x.id === examId); if (!ex) return null;

                        .subjectId); if (!s || !s.lastReview) return { level: 'unknown',
                        detail: "Not enough study activity yet to estimate this." };
                    const daysSince = Math.round((dateFrom(localDate()) - dateFrom(s.lastReview)) / 86400000); if (
                        daysSince <= 3) return { level: 'good', detail: `Studied recently (${fmtDate(s.lastReview)}).` };

                const topics = sitting.topics.map(id => state.classTopics.find(t => t.id === id)).filter(Boolean); if (

                if (studied.length === topics.length && goodCount === topics.length) return { level: 'good',
                    detail: 'Every topic has been studied and is going well.' };

            function testDetailModal(examId) { const ex = state.exams.find(x => x.id === examId); if (!ex) return
                    modalShell('Test', '<p class="empty">This test no longer exists.</p>',
                    '<button class="button" data-action="close-modal">Close</button>');
                const sitting = ex.sittings[0], subj = subject(sitting?.subjectId), conf = testConfidence(examId),

                    `<button class="button" data-action="close-modal">Close</button><button class="button ghost" data-action="edit-exam" data-id="${examId}">Edit test</button><button class="button primary" data-action="open-exam-result" data-exam="${examId}" data-subject="${sitting?.subjectId||''}">Enter results</button>`,

                    : '';
                return modalShell(`${escape(subj.name)} result`,
                    `<div class="form-grid"><div class="field span-2"><label for="result-marking-type">How is this graded?</label><select id="result-marking-type"><option value="">Choose one...</option><option value="letter" ${mt==='letter'?'selected':''}>Letter grade</option><option value="lc" ${mt==='lc'?'selected':''}>Leaving Cert (H/O)</option><option value="jc" ${mt==='jc'?'selected':''}>Junior Cycle</option></select></div>${gradeFields}${mt?`<div class="field span-2"><label for="result-percent">Percentage</label><div class="row"><input id="result-percent" type="number" min="0" max="100" value="${unknown?'':(r.percent??'')}" placeholder="e.g. 72" ${unknown?'disabled':''} style="flex:1"><button type="button" class="button ${unknown?'primary':'ghost'}" data-action="result-toggle-unknown">${unknown?'Unknown ✓':'Unknown'}</button></div></div><div class="field span-2"><label for="result-notes">Anything that went particularly well or badly?</label><textarea id="result-notes" placeholder="Optional — feeds into what the AI nudges you to focus on">${escape(r.notes||'')}</textarea></div>${topicResultsBlock}`:''}</div>`,
                    `<button class="button" data-action="close-modal">Cancel</button>${sitting?.result?`<button class="button danger" data-action="clear-exam-result" data-exam="${examId}" data-subject="${subjectId}">Clear result</button>`:''}<button class="button primary" data-action="save-exam-result" data-exam="${examId}" data-subject="${subjectId}">Save result</button>`,
                    false); }

            function eventDetailsModal(e, slot, dashboard, occurrenceDate) { const s = subject(e.subjectId);
                const dated = occurrenceDate ? fmtDate(occurrenceDate, { weekday: 'long', month: 'long', day: 'numeric' }) :
                    e.date ? fmtDate(e.date) : 'Weekly';
                const relevant = dashboard && e.subjectId && occurrenceDate ? state.tasks.filter(t => t.subjectId ===
                    e.subjectId && !t.done && t.due === occurrenceDate).sort((a, b) => a.due.localeCompare(b.due)) : [];
                const planItems = dashboard && e.type === 'study' && occurrenceDate ? (ensureStudyPlan(occurrenceDate)
                    ?.blocks.find(b => b.blockEventId === e.id && b.blockSlotId === slot.id)?.items || []) : null;
                const remindable = e.type !== 'sleep' && e.type !== 'study';
                const myReminders = dashboard && remindable && occurrenceDate ? state.reminders.filter(r => r
                    .eventId === e.id && r.targetDate === occurrenceDate && !r.dismissed) : null;
                const hasMany = e.slots.length > 1; return modalShell(escape(e.name),
                    `<div class="event-detail"><div class="event-preview ${e.type}" style="background:${e.color};color:${contrast(e.color)}"><strong>${TYPE_INFO[e.type].icon} ${escape(e.name)}</strong><div class="small" style="color:inherit;opacity:.78">${studyKindLabel(e)}</div></div><div class="detail-grid"><div><span>Time</span><strong>${time(mins(slot.start))} – ${time(mins(slot.end))} · ${fmtMins(duration(slot.start,slot.end))}</strong></div><div><span>When</span><strong>${dated}</strong></div>${s?`<div><span>Subject</span><strong>${escape(s.name)}</strong></div>`:''}${e.teacher?`<div><span>Teacher / room</span><strong>${escape(e.teacher)}</strong></div>`:''}</div>${e.details?`<div class="alert success">${escape(e.details)}</div>`:''}${!dashboard&&hasMany?`<div class="alert warning">This event has ${e.slots.length} regular times. You can change or delete just this time, or the whole series.</div>`:''}${planItems?`<div><h3>What you'll be studying</h3><div class="list">${planItems.length?planItems.map(i=>`<div class="plan-item-row"><span>${escape(i.label)}</span><span class="small">${fmtMins(i.minutes)}</span></div>`).join(''):`<p class="empty">Nothing planned for this block yet.</p>`}</div></div>`:''}${dashboard&&e.type==='class'?`<div><h3>Work due for this class</h3><div class="list">${relevant.length?relevant.map(t=>taskRow(t,cushions())).join(''):`<p class="empty">Nothing is due the day of this class.</p>`}</div></div>`:''}${myReminders?`<div><h3>Reminders</h3><div class="list">${myReminders.length?myReminders.map(r=>`<div class="reminder-row ${r.importance?'important':''}"><span>${r.importance?'❗ ':''}${escape(r.text)}</span><button class="button ghost" data-action="dismiss-reminder" data-id="${r.id}" aria-label="Dismiss">×</button></div>`).join(''):`<p class="empty">No reminders yet.</p>`}</div><form id="reminder-form" class="form-grid" style="margin-top:10px"><input id="reminder-text" placeholder="e.g. Bring in project folder" class="field span-2"><label class="switch-row field span-2"><input id="reminder-important" type="checkbox"> Mark as high importance</label></form></div>`:''}</div>`,
                    dashboard ?
                    (remindable ? `<button class="button" data-action="close-modal">Close</button><button class="button primary" data-action="add-reminder" data-event="${e.id}" data-date="${occurrenceDate}">＋ Add reminder</button>` :
                        `<button class="button" data-action="close-modal">Close</button>`) :
                    `<button class="button danger" data-action="delete-event-slot" data-id="${e.id}" data-slot="${slot.id}">Delete this time</button><button class="button danger" data-action="delete-event" data-id="${e.id}">Delete series</button><button class="button" data-action="edit-event-slot" data-id="${e.id}" data-slot="${slot.id}">Edit this time</button><button class="button primary" data-action="edit-event" data-id="${e.id}">Edit series</button>`,
                    true); }

            function openEvent(id, slotId, dashboard, date) { const e = event(id);
                const slot = e?.slots.find(s => s.id === slotId); if (e && slot) openModal('event-details', { event: e,
                    slot, dashboard, date }); }

            function saveEvent() { const form = document.getElementById('event-form'); if (!form.reportValidity())
                return;
                const id = document.getElementById('event-id').value;
                const old = id ? event(id) : null;
                const editSlotId = modal.event?.editSlotId || '';
                const type = modal.event?.type || 'class';
                const weekly = document.getElementById('event-weekly').checked;
                const slots = [...document.querySelectorAll('#slots .slot')].map(el => ({ id: el.dataset.slotId,
                    start: el.querySelector('.slot-start').value, end: el.querySelector('.slot-end').value,
                    days: [...el.querySelectorAll('.day-chip.active')].map(b => Number(b.dataset.day)) }));
                const name = (document.getElementById('event-name')?.value || '').trim() || (type === 'sleep' ? 'Sleep' :
                    'Planned study'); if (slots.some(s => !s.start || !s.end || (weekly && !s.days.length))) { toast(
                        'Give every time a start, an end, and at least one day.'); return; }
                const color = type === 'study' ? studyColorFor(modal.event?.studyKind || old?.studyKind || 'self') :
                    (document.getElementById('event-color')?.value || '#335CFF');
                // A class's name IS its subject: find or create the matching subject instead of asking the
                // user to pick one, and sync whether it's an exam subject from the checkbox.
                let subjectId; if (type === 'class') { subjectId = findOrCreateSubjectByClassName(name, color);
                    const linked = subject(subjectId); if (linked) linked.examSubject = !!document.getElementById(
                        'event-exam-subject')?.checked; } else subjectId = document.getElementById('event-subject')
                    ?.value || '';
                const examPeriodId = old?.examPeriodId || modal.event?.examPeriodId || '';
                const studyKind = modal.event?.studyKind || old?.studyKind || 'self';
                const candidate = { id: id || uid(), type, name, subjectId,
                    teacher: document.getElementById('event-teacher')?.value || '',
                    inSchool: !!document.getElementById('event-school')?.checked, color,
                    details: document.getElementById('event-details')?.value || '', date: weekly ? '' : document
                        .getElementById('event-date').value, slots, skipDates: old?.skipDates || [],
                    ...(examPeriodId ? { examPeriodId } : {}),
                    ...(type === 'study' ? { studyKind, examId: old?.examId,
                        replacesEventId: old?.replacesEventId, replacesDate: old?.replacesDate,
                        skippable: studyKind !== 'supervised' } : {}) };
                const clash = examPeriodId ? null : findClash(candidate, old?.id, editSlotId); if (clash) { toast(
                        `That overlaps with ${clash.event.name} on ${DAY_NAMES[mondayIndex(clash.date)]}.`); return; } if (
                    old && editSlotId) { state.events = state.events.map(e => e.id === id ? { ...e, slots: e.slots.map(
                            s => s.id === editSlotId ? candidate.slots[0] : s) } : e); } else if (old) state.events =
                    state.events.map(e => e.id === id ? candidate : e);
                else state.events.push(candidate);

                    toast(old ? 'Updated.' : 'Added to this exam period.'); return; }
                closeModal();
                render();

            function eventSegments(e, date) { const list = [];
                e.slots.forEach(s => { const start = mins(s.start),
                        end = mins(s.end),
                        over = end <= start,
                        prev = addDays(date, -1); if (sourceMatches(e, date, s)) list.push([start, over ? 1440 :
                        end
                    ]); if (over && sourceMatches(e, prev, s)) list.push([0, end]); }); return list; }

            function findClash(candidate, excludeId = '', excludeSlotId = '') { const start = candidate.date || state
                .week;
                const end = candidate.date ? candidate.date : addDays(start, 6); for (let date = start; date <= end;
                    date = addDays(date, 1)) { for (const [a, b] of eventSegments(candidate, date)) { for (const other
                        of state.events) { if (other.id === excludeId && !excludeSlotId) continue;
                        const comparable = other.id === excludeId ? { ...other, slots: other.slots.filter(s => s

                            inSchool: { type: "BOOLEAN", description: "Whether this happens at school. Relevant for 'activity' and 'study' events." },
                            studyKind: { type: "STRING", enum: ["self", "supervised"], description: "For 'study' events only. Defaults to 'self' — self-directed study, fine to skip/move. Use 'supervised' for study the user genuinely cannot skip, like a compulsory school study hall — skip_event_occurrence will then refuse to cancel a single occurrence of it without an explicit override." },
                            details: { type: "STRING", description: "Optional free-text notes, location, or study method." },
                            color: { type: "STRING", description: "Optional hex colour like #335CFF. Ignored for 'study' events, which are always green." },
                            weekly: { type: "BOOLEAN", description: "True (default) for something that repeats every week on given days. False for a single one-off event on a specific date." },
                            date: { type: "STRING", description: "YYYY-MM-DD. Required only when weekly is false." },
                            slots: {
                                type: "ARRAY",
                                description: "One or more time ranges for this event.",
                                items: {
                                    type: "OBJECT",
                                    properties: {
                                        days: { type: "ARRAY", items: { type: "INTEGER" }, description: "Days this time range applies to: 0=Monday, 1=Tuesday, 2=Wednesday, 3=Thursday, 4=Friday, 5=Saturday, 6=Sunday. Required when weekly is true; ignored when weekly is false." },
                                        start: { type: "STRING", description: "24-hour start time, HH:MM." },
                                        end: { type: "STRING", description: "24-hour end time, HH:MM." }
                                    },
                                    required: ["start", "end"]
                                }
                            }
                        },
                        required: ["type", "name", "slots"]
                    },
                    handler: (args) => {
                        const type = args.type || "study";
                        if (!TYPE_INFO[type] || type === "holiday" || type === "examSitting") return { error: `Invalid type. Valid types: ${Object.keys(TYPE_INFO).filter(k => k !== "holiday" && k !== "examSitting").join(", ")}` };
                        let examPeriodId = "";
                        if (args.examId) { if (!state.exams.some(x => x.id === args.examId)) return { error: "No exam found with that id. Call read_app_state to look up current exam ids." };
                            examPeriodId = args.examId; }
                        const weekly = args.weekly !== false;
                        const slots = (args.slots || []).map(s => ({ id: uid(), days: (s.days || []).map(Number), start: s.start, end: s.end }));
                        if (!slots.length) return { error: "At least one slot with a start and end time is required." };
                        for (const s of slots) {
                            if (!s.start || !s.end) return { error: "Every slot needs a start and end time in 24-hour HH:MM format." };
                            if (weekly && !s.days.length) return { error: "Weekly events need at least one day per slot (0=Monday..6=Sunday)." };
                        }
                        const name = args.name || (type === "sleep" ? "Sleep" : "Planned study");
                        let subjectId = args.subjectId || "", color;
                        if (type === "class") {
                            subjectId = findOrCreateSubjectByClassName(name, args.color || null);
                            const linked = subject(subjectId);
                            color = linked ? linked.color : (args.color || CATEGORY_COLORS[type] || "#335CFF");
                            if (linked && args.examSubject !== undefined) linked.examSubject = !!args.examSubject;
                        } else {
                            color = type === "study" ? studyColorFor(args.studyKind === "supervised" ? "supervised" : "self") : (args.color || CATEGORY_COLORS[type] || "#335CFF");
                        }
                        const studyKind = args.studyKind === "supervised" ? "supervised" : "self";
                        const candidate = {
                            id: uid(), type, name,
                            subjectId, teacher: args.teacher || "",
                            inSchool: !!args.inSchool,
                            color,
                            details: args.details || "", date: weekly ? "" : (args.date || localDate()),
                            slots,
                            ...(examPeriodId ? { examPeriodId } : {}),
                            ...(type === "study" ? { studyKind, skippable: studyKind !== "supervised" } : {})
                        };
                        const clash = examPeriodId ? null : findClash(candidate);
                        if (clash) return { error: `That overlaps with "${clash.event.name}" on ${DAY_NAMES[mondayIndex(clash.date)]}. Pick a different time, or call find_free_slot first.` };
                        state.events.push(candidate);
                        save(); render();
                        toast(`AI added "${candidate.name}" to your timetable.`);
                        return { success: true, id: candidate.id, event: candidate };
                    }
                },

                update_event: {
                    description: "Edit an existing timetable event (change its name, time, day, subject, etc). Get the event's id from read_app_state first. Only include fields in patch that should change.",
                    parameters: {
                        type: "OBJECT",
                        properties: {
                            id: { type: "STRING", description: "The event's id." },
                            patch: {
                                type: "OBJECT",
                                description: "Fields to change: any of name, type, teacher, inSchool, details, color, date, slots (full replacement array in the same shape as add_event's slots). For 'class' events, subjectId is ignored (it's derived from name) — include examSubject (boolean) instead to change whether this class's subject is used to fill spare study time. For 'study' events, studyKind ('self'|'supervised') controls whether skip_event_occurrence can cancel a single occurrence without an explicit override.",
                                properties: {}
                            }
                        },
                        required: ["id", "patch"]
                    },
                    handler: (args) => {
                        const existing = event(args.id);
                        if (!existing) return { error: "No event found with that id. Call read_app_state to look up current ids." };
                        const patch = args.patch || {};
                        if (patch.type !== undefined && (!TYPE_INFO[patch.type] || patch.type === "holiday" || patch.type === "examSitting")) return { error: `Invalid type. Valid types: ${Object.keys(TYPE_INFO).filter(k => k !== "holiday" && k !== "examSitting").join(", ")}` };
                        const candidate = { ...existing, ...patch };
                        if (patch.slots) candidate.slots = patch.slots.map(s => ({ id: s.id || uid(), days: (s.days || []).map(Number), start: s.start, end: s.end }));
                        if (candidate.type === "class" && (patch.name !== undefined || patch.type !== undefined)) {
                            candidate.subjectId = findOrCreateSubjectByClassName(candidate.name, candidate.color);
                        }
                        if (candidate.type === "class" && patch.examSubject !== undefined) {
                            const linked = subject(candidate.subjectId);
                            if (linked) linked.examSubject = !!patch.examSubject;
                        }
                        if (candidate.type === "study" && patch.studyKind !== undefined) {
                            candidate.studyKind = patch.studyKind === "supervised" ? "supervised" : "self";
                            candidate.skippable = candidate.studyKind !== "supervised";
                            if (!patch.color) candidate.color = studyColorFor(candidate.studyKind);
                        }
                        const clash = findClash(candidate, existing.id);
                        if (clash) return { error: `That overlaps with "${clash.event.name}" on ${DAY_NAMES[mondayIndex(clash.date)]}.` };
                        state.events = state.events.map(x => x.id === existing.id ? candidate : x);
                        save(); render();
                        toast(`AI updated "${candidate.name}".`);
                        return { success: true, event: candidate };
                    }
                },

                delete_event: {
                    description: "Permanently remove a timetable event (all of its times). Get the id from read_app_state first.",
                    parameters: { type: "OBJECT", properties: { id: { type: "STRING" } }, required: ["id"] },
                    handler: (args) => {
                        const existing = event(args.id);
                        if (!existing) return { error: "No event found with that id." };
                        state.events = state.events.filter(x => x.id !== args.id);
                        save(); render();
                        toast(`AI deleted "${existing.name}".`);
                        return { success: true };
                    }
                },

                add_task: {
                    description: "Add a homework or project task with a due date. For a test, use add_exam with assessmentType 'test' instead — tests live in Tests & Exams now, not the task list, so they can have topics and results assigned like a real exam.",
                    parameters: {
                        type: "OBJECT",
                        properties: {
                            title: { type: "STRING" },
                            type: { type: "STRING", enum: ["homework", "project"] },
                            subjectId: { type: "STRING", description: "Optional subject id from read_app_state." },
                            due: { type: "STRING", description: "YYYY-MM-DD due date." },
                            minutes: { type: "INTEGER", description: "Estimated minutes of work needed." },
                            online: { type: "BOOLEAN", description: "Whether it can be submitted online (vs. physically at the subject's first class that day)." },
                            important: { type: "BOOLEAN", description: "Whether it's important/graded." },

                        const type = args.type === "project" ? "project" : "homework";
                        const task = {
                            id: uid(), title: args.title, type, subjectId: args.subjectId || "", due: args.due,
                            minutes: Number(args.minutes || 60),
                            online: !!args.online, important: !!args.important, details: args.details || "", done: false
                        };
                        state.tasks.push(task);
                        save(); render();
                        toast(`AI added task "${task.title}".`);
